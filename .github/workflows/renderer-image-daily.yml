name: renderer-image-daily

on:
  schedule:
    # 03:17 JST. Avoid the busiest top-of-hour scheduling window.
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      texlive_date:
        description: "TeX Live snapshot: latest or YYYY-MM-DD"
        required: true
        default: latest
        type: string
      publish:
        description: "Publish a validated image to GHCR"
        required: true
        default: true
        type: boolean
      purge_legacy_runtimes:
        description: "Remove unsupported legacy public runtime-v1 images"
        required: true
        default: true
        type: boolean
      maintenance_only:
        description: "Run validated registry retention only, without image build or publication"
        required: true
        default: false
        type: boolean
      builder_driver:
        description: "Native Docker image store or previous container/export path"
        type: choice
        options: [docker, docker-container]
        default: docker
      format_jobs:
        description: "Runtime format generation workers (1 keeps the serial baseline)"
        type: choice
        options: ["1", "2", "4"]
        default: "4"
      database_save_batch:
        description: "Validated hosted default 64; 16 is non-publishing only"
        type: choice
        options: ["1", "16", "64"]
        default: "64"

permissions:
  contents: read

concurrency:
  group: renderer-image-daily
  cancel-in-progress: false

jobs:
  validate-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      date: ${{ steps.snapshot.outputs.date }}
      repository: ${{ steps.snapshot.outputs.repository }}
      installer: ${{ steps.snapshot.outputs.installer_sha512 }}
      database: ${{ steps.snapshot.outputs.database_sha512 }}
      snapshot-id: ${{ steps.snapshot.outputs.snapshot_id }}
      mode: ${{ steps.plan.outputs.mode }}
      digest: ${{ steps.plan.outputs.digest }}
      architectures: ${{ steps.plan.outputs.architectures }}
      amd64-digest: ${{ steps.plan.outputs.amd64_digest }}
      arm64-digest: ${{ steps.plan.outputs.arm64_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Enable Corepack
        run: corepack enable
      - name: Install integration-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes age acl libarchive-tools nginx-light
      - name: Install and validate source
        run: |
          pnpm install --frozen-lockfile
          pnpm check
      - name: Resolve one canonical snapshot for all native builds
        if: inputs.maintenance_only != true
        id: snapshot
        env:
          REQUESTED_DATE: ${{ inputs.texlive_date || 'latest' }}
          TEXLIVE_CI_MIRROR_HOST: ${{ secrets.TEXLIVE_CI_MIRROR_HOST }}
        run: sh deploy/scripts/resolve-texlive-snapshot.sh "$REQUESTED_DATE"
      - name: Plan immutable Base publication without registry writes
        if: inputs.maintenance_only != true
        id: plan
        env:
          SNAPSHOT_DATE: ${{ steps.snapshot.outputs.date }}
        run: node deploy/scripts/ghcr-base-publication.mjs plan "$SNAPSHOT_DATE"

  build-and-publish:
    if: github.event_name != 'workflow_dispatch' || inputs.maintenance_only != true
    needs: validate-source
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(needs.validate-source.outputs.architectures) }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/n624-dev/latex-renderer-texlive
      CI_ARCHITECTURE: ${{ matrix.architecture }}
      SNAPSHOT_DATE: ${{ needs.validate-source.outputs.date }}
      TEXLIVE_REPOSITORY: ${{ needs.validate-source.outputs.repository }}
      TEXLIVE_INSTALLER_SHA512: ${{ needs.validate-source.outputs.installer }}
      TEXLIVE_DATABASE_SHA512: ${{ needs.validate-source.outputs.database }}
      MIRROR_SNAPSHOT_ID: ${{ needs.validate-source.outputs.snapshot-id }}
      EXISTING_MANIFEST_DIGEST: ${{ matrix.architecture == 'arm64' && needs.validate-source.outputs.arm64-digest || needs.validate-source.outputs.amd64-digest }}
      REQUESTED_DATE: ${{ github.event.inputs.texlive_date || 'latest' }}
      PUBLISH_REQUESTED: ${{ github.event_name == 'schedule' || inputs.publish == true }}
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      CI_RENDERER_DRIVER: ${{ inputs.builder_driver || 'docker' }}
      CI_FORMAT_JOBS: ${{ inputs.format_jobs || '4' }}
      CI_DATABASE_SAVE_BATCH: ${{ inputs.database_save_batch || '64' }}
      # Register the private distribution hostname with the runner's log
      # masker before any step can emit a snapshot URL.
      TEXLIVE_CI_MIRROR_HOST: ${{ secrets.TEXLIVE_CI_MIRROR_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Validate disposable database save settings
        run: sh deploy/scripts/ci-texlive-database-save-settings.sh

      - name: Verify native execution and install digest-only transfer tooling
        run: |
          set -euo pipefail
          case "$CI_ARCHITECTURE:$(uname -m)" in amd64:x86_64|arm64:aarch64) ;; *) exit 65 ;; esac
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes skopeo
          CI_BASE_INDEX_PROBE=1 node deploy/ci/check-base-index.mjs

      - name: Validate legacy Runtime cleanup request
        if: github.event_name == 'workflow_dispatch' && inputs.purge_legacy_runtimes == true
        run: |
          set -euo pipefail
          [[ "$PUBLISH_REQUESTED" == true ]]
          [[ "$REQUESTED_DATE" == latest ]]

      - name: Verify GHCR package write access
        if: env.PUBLISH_REQUESTED == 'true'
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: node deploy/scripts/verify-ghcr-write-access.mjs "$IMAGE_REPOSITORY"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: env.CI_RENDERER_DRIVER == 'docker-container'
        id: buildx
        with:
          name: latex-renderer-ghcr
          driver: docker-container
          cleanup: true
      - name: Select and verify renderer builder
        id: renderer-builder
        env:
          CONTAINER_BUILDER: ${{ steps.buildx.outputs.name }}
        run: sh deploy/scripts/ci-select-renderer-builder.sh "$CI_RENDERER_DRIVER" "$CONTAINER_BUILDER"

      - name: Install pinned cloudflared client when mirror credentials are available
        env:
          TEXLIVE_CI_HOST: ${{ secrets.TEXLIVE_CI_HOST }}
          TEXLIVE_CI_SSH_KEY: ${{ secrets.TEXLIVE_CI_SSH_KEY }}
          TEXLIVE_CI_KNOWN_HOSTS: ${{ secrets.TEXLIVE_CI_KNOWN_HOSTS }}
          TEXLIVE_CI_ACCESS_CLIENT_ID: ${{ secrets.TEXLIVE_CI_ACCESS_CLIENT_ID }}
          TEXLIVE_CI_ACCESS_CLIENT_SECRET: ${{ secrets.TEXLIVE_CI_ACCESS_CLIENT_SECRET }}
        run: |
          configured=0
          for value in "$TEXLIVE_CI_HOST" "$TEXLIVE_CI_SSH_KEY" "$TEXLIVE_CI_KNOWN_HOSTS" "$TEXLIVE_CI_ACCESS_CLIENT_ID" "$TEXLIVE_CI_ACCESS_CLIENT_SECRET" "$TEXLIVE_CI_MIRROR_HOST"; do
            [ -n "$value" ] && configured=$((configured + 1))
          done
          if [ -z "$TEXLIVE_CI_SSH_KEY$TEXLIVE_CI_ACCESS_CLIENT_ID$TEXLIVE_CI_ACCESS_CLIENT_SECRET" ]; then
            exit 0
          fi
          [ "$configured" -eq 6 ] || { echo 'Partial TeX Live CI mirror configuration' >&2; exit 64; }
          sh deploy/scripts/install-cloudflared-client.sh

      - name: Reserve exact CI mirror snapshot when credentials are available
        id: mirror
        env:
          TEXLIVE_CI_HOST: ${{ secrets.TEXLIVE_CI_HOST }}
          TEXLIVE_CI_USER: ${{ secrets.TEXLIVE_CI_USER }}
          TEXLIVE_CI_SSH_KEY: ${{ secrets.TEXLIVE_CI_SSH_KEY }}
          TEXLIVE_CI_KNOWN_HOSTS: ${{ secrets.TEXLIVE_CI_KNOWN_HOSTS }}
          TEXLIVE_CI_ACCESS_CLIENT_ID: ${{ secrets.TEXLIVE_CI_ACCESS_CLIENT_ID }}
          TEXLIVE_CI_ACCESS_CLIENT_SECRET: ${{ secrets.TEXLIVE_CI_ACCESS_CLIENT_SECRET }}
        run: |
          echo "repository=$TEXLIVE_REPOSITORY" >> "$GITHUB_OUTPUT"
          configured=0
          for value in "$TEXLIVE_CI_HOST" "$TEXLIVE_CI_SSH_KEY" "$TEXLIVE_CI_KNOWN_HOSTS" "$TEXLIVE_CI_ACCESS_CLIENT_ID" "$TEXLIVE_CI_ACCESS_CLIENT_SECRET" "$TEXLIVE_CI_MIRROR_HOST"; do
            [ -n "$value" ] && configured=$((configured + 1))
          done
          if [ -z "$TEXLIVE_CI_SSH_KEY$TEXLIVE_CI_ACCESS_CLIENT_ID$TEXLIVE_CI_ACCESS_CLIENT_SECRET" ]; then
            exit 0
          fi
          [ "$configured" -eq 6 ] || { echo 'Partial TeX Live CI mirror configuration' >&2; exit 64; }
          if [ "$configured" -eq 6 ]; then
            sh deploy/scripts/ci-texlive-mirror-lease.sh acquire \
              "$SNAPSHOT_DATE" "$TEXLIVE_INSTALLER_SHA512" "$CI_ARCHITECTURE" \
              "$MIRROR_SNAPSHOT_ID" "$TEXLIVE_DATABASE_SHA512"
          fi

      - name: Build and validate
        id: validate
        env:
          TEXLIVE_DOWNLOAD_REPOSITORY: ${{ steps.mirror.outputs.repository }}
          BUILDX_BUILDER: ${{ steps.renderer-builder.outputs.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: n624-dev
          GHCR_PACKAGE: latex-renderer-texlive
        run: |
          set -euo pipefail
          sh deploy/scripts/ci-renderer-disk.sh before-base-build 12
          base="latex-renderer:base-$SNAPSHOT_DATE"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          if [[ "$CI_DATABASE_SAVE_BATCH" == 16 && -n "$EXISTING_MANIFEST_DIGEST" ]]; then
            echo 'Database save comparison requires a cold build; use non-publishing renderer-image.' >&2
            exit 64
          fi
          if [[ -n "$EXISTING_MANIFEST_DIGEST" ]]; then
            [[ "$EXISTING_MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            base="$IMAGE_REPOSITORY@$EXISTING_MANIFEST_DIGEST"
            docker pull "$base"
          else
            sh deploy/scripts/generate-texlive-profile.sh \
              "$TEXLIVE_DOWNLOAD_REPOSITORY" renderer/texlive.profile "$CI_ARCHITECTURE"
            if grep -Eq '^collection-lang[^[:space:]]*[[:space:]]+1$' renderer/texlive.profile; then
              echo 'Generated base profile selects an optional language collection.' >&2
              exit 65
            fi
            docker buildx build \
              --builder "$BUILDX_BUILDER" \
              --no-cache \
              --pull \
              --load \
              --file renderer/Dockerfile.base \
              --build-arg "TEXLIVE_REPOSITORY=$TEXLIVE_REPOSITORY" \
              --build-arg "TEXLIVE_INSTALLER_SHA512=$TEXLIVE_INSTALLER_SHA512" \
              --build-arg "TEXLIVE_PROFILE_KIND=language-neutral-maximal" \
              --build-arg "TEXLIVE_DATABASE_SAVE_BATCH=$CI_DATABASE_SAVE_BATCH" \
              --build-arg "TEXLIVE_DISPOSABLE_CI=1" \
              --secret id=texlive_download_repository,env=TEXLIVE_DOWNLOAD_REPOSITORY \
              --tag "$base" \
              renderer
          fi

          [[ $(docker image inspect "$base" --format '{{.Architecture}}') == "$CI_ARCHITECTURE" ]]
          [[ $(docker image inspect "$base" --format '{{index .Config.Labels "org.opencontainers.image.title"}}') == latex-renderer-texlive ]]
          [[ $(docker image inspect "$base" --format '{{index .Config.Labels "jp.n624.latex-renderer.texlive.profile-kind"}}') == language-neutral-maximal ]]
          [[ $(docker image inspect "$base" --format '{{index .Config.Labels "jp.n624.latex-renderer.base-kind"}}') == texlive-only-v1 ]]
          [[ $(docker image inspect "$base" --format '{{index .Config.Labels "jp.n624.latex-renderer.texlive.repository"}}') == "$TEXLIVE_REPOSITORY" ]]
          [[ $(docker image inspect "$base" --format '{{index .Config.Labels "jp.n624.latex-renderer.texlive.installer-sha512"}}') == "$TEXLIVE_INSTALLER_SHA512" ]]
          sh deploy/scripts/ci-validate-texlive-base.sh \
            "$base" "$TEXLIVE_DOWNLOAD_REPOSITORY" "$TEXLIVE_REPOSITORY"

          docker tag "$base" "latex-renderer:validated-base-$SNAPSHOT_DATE"

          printf '%s\n' "$base" > "$RUNNER_TEMP/validated-base-image"

      - name: Generate CycloneDX SBOM for the validated Base
        if: steps.validate.outcome == 'success'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: latex-renderer:validated-base-${{ needs.validate-source.outputs.date }}
          format: cyclonedx-json
          output-file: latex-renderer-texlive-base.cdx.json
          artifact-name: latex-renderer-texlive-base-${{ matrix.architecture }}.cdx.json
          upload-artifact: true
          dependency-snapshot: false

      - name: Register only the validated Base by digest, without public tags
        if: needs.validate-source.outputs.mode != 'legacy'
        run: |
          set -euo pipefail
          base=$(cat "$RUNNER_TEMP/validated-base-image")
          sh deploy/scripts/ci-renderer-disk.sh before-base-transfer 6
          node deploy/scripts/ghcr-base-publication.mjs stage "$base" "$RUNNER_TEMP/native-receipt"

      - name: Transfer bounded validation receipt, not image layers or a cache
        if: needs.validate-source.outputs.mode != 'legacy'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-base-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-receipt/
          retention-days: 1
          if-no-files-found: error

      - name: Clean local image state
        if: always()
        env:
          BUILDX_BUILDER: ${{ steps.renderer-builder.outputs.name }}
        run: |
          set +e
          docker image rm \
            "latex-renderer:validated-base-${SNAPSHOT_DATE:-unknown}" \
            "latex-renderer:ci-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$IMAGE_REPOSITORY:${SNAPSHOT_DATE:-unknown}" \
            "$IMAGE_REPOSITORY:latest" \
            "latex-renderer:base-${SNAPSHOT_DATE:-unknown}" \
            >/dev/null 2>&1 || true
          if [[ "${BUILDX_BUILDER:-default}" == default ]]; then
            docker builder prune --all --force >/dev/null 2>&1 || true
          else
            docker buildx prune --builder "$BUILDX_BUILDER" --all --force >/dev/null 2>&1 || true
            docker buildx rm --force "$BUILDX_BUILDER" >/dev/null 2>&1 || true
          fi
          docker logout ghcr.io >/dev/null 2>&1 || true

      - name: Release CI mirror reservation
        if: always() && steps.mirror.outputs.token != ''
        env:
          TEXLIVE_CI_HOST: ${{ secrets.TEXLIVE_CI_HOST }}
          TEXLIVE_CI_USER: ${{ secrets.TEXLIVE_CI_USER }}
          TEXLIVE_CI_SSH_KEY: ${{ secrets.TEXLIVE_CI_SSH_KEY }}
          TEXLIVE_CI_KNOWN_HOSTS: ${{ secrets.TEXLIVE_CI_KNOWN_HOSTS }}
          TEXLIVE_CI_ACCESS_CLIENT_ID: ${{ secrets.TEXLIVE_CI_ACCESS_CLIENT_ID }}
          TEXLIVE_CI_ACCESS_CLIENT_SECRET: ${{ secrets.TEXLIVE_CI_ACCESS_CLIENT_SECRET }}
        run: sh deploy/scripts/ci-texlive-mirror-lease.sh release '${{ steps.mirror.outputs.token }}' '${{ steps.mirror.outputs.owner }}'

  publish-index:
    if: needs.validate-source.outputs.mode != 'legacy' && (github.event_name == 'schedule' || inputs.publish == true)
    needs: [validate-source, build-and-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-base-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts
          merge-multiple: true
          digest-mismatch: error
      - name: Publish immutable dated image only after both native validations
        id: publish
        env:
          SNAPSHOT_DATE: ${{ needs.validate-source.outputs.date }}
          TEXLIVE_REPOSITORY: ${{ needs.validate-source.outputs.repository }}
          TEXLIVE_INSTALLER_SHA512: ${{ needs.validate-source.outputs.installer }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_ACTOR: ${{ github.actor }}
        run: node deploy/scripts/ghcr-base-publication.mjs publish "$RUNNER_TEMP/receipts"

  verify-public:
    needs: [validate-source, publish-index]
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify anonymous pull on each native architecture
        env:
          IMAGE_DIGEST: ${{ needs.publish-index.outputs.digest }}
          CI_ARCHITECTURE: ${{ matrix.architecture }}
          TEXLIVE_REPOSITORY: ${{ needs.validate-source.outputs.repository }}
          TEXLIVE_INSTALLER_SHA512: ${{ needs.validate-source.outputs.installer }}
        run: |
          set -euo pipefail
          case "$CI_ARCHITECTURE:$(uname -m)" in amd64:x86_64|arm64:aarch64) ;; *) exit 65 ;; esac
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          sh deploy/scripts/ci-renderer-disk.sh before-anonymous-pull 6
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"
          mkdir -m 0700 "$DOCKER_CONFIG"
          base="ghcr.io/n624-dev/latex-renderer-texlive@$IMAGE_DIGEST"
          docker pull "$base"
          [[ $(docker image inspect "$base" --format '{{.Architecture}}') == "$CI_ARCHITECTURE" ]]
          [[ $(docker image inspect "$base" --format '{{index .Config.Labels "jp.n624.latex-renderer.texlive.repository"}}') == "$TEXLIVE_REPOSITORY" ]]
          [[ $(docker image inspect "$base" --format '{{index .Config.Labels "jp.n624.latex-renderer.texlive.installer-sha512"}}') == "$TEXLIVE_INSTALLER_SHA512" ]]
          sh deploy/scripts/smoke-test-texlive-base.sh "$base"

  promote-latest:
    if: github.event.inputs.texlive_date == 'latest' || github.event_name == 'schedule'
    needs: [validate-source, publish-index, verify-public]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Promote latest only after both native anonymous pulls
        env:
          IMAGE_DIGEST: ${{ needs.publish-index.outputs.digest }}
          SNAPSHOT_DATE: ${{ needs.validate-source.outputs.date }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_ACTOR: ${{ github.actor }}
        run: node deploy/scripts/ghcr-base-publication.mjs promote "$IMAGE_DIGEST"
  registry-maintenance:
    # Wait for every publisher, but do not leave orphan uploads unbounded when
    # a native build, anonymous check or promotion fails. Non-publishing runs
    # never mutate registry retention, and source validation remains mandatory.
    if: always() && needs.validate-source.result == 'success' && (github.event_name == 'schedule' || inputs.publish == true) && (github.event_name == 'schedule' || inputs.texlive_date == 'latest')
    needs:
      [
        validate-source,
        build-and-publish,
        publish-index,
        verify-public,
        promote-latest,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Validate maintenance request
        env:
          PUBLISH_REQUESTED: ${{ github.event_name == 'schedule' || inputs.publish == true }}
          REQUESTED_DATE: ${{ inputs.texlive_date || 'latest' }}
        run: |
          set -euo pipefail
          [[ "$PUBLISH_REQUESTED" == true ]]
          [[ "$REQUESTED_DATE" == latest ]]
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Authenticate registry metadata operations
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
      - name: Verify and perform registry retention
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GHCR_PURGE_LEGACY_RUNTIMES: ${{ github.event_name == 'schedule' || inputs.purge_legacy_runtimes == true }}
        run: node deploy/scripts/ghcr-retention.mjs
      - name: Clear registry login
        if: always()
        run: docker logout ghcr.io
