name: actions-cache-cleanup

on:
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: actions-cache-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Daily/manual safety net only; workflows do not intentionally save caches.
      # No checkout, artifacts or code from other workflows are used.
      # Caches are disposable; this does not delete GHCR images/release assets.
      - name: Remove disposable Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh cache delete --all --succeed-on-no-caches
