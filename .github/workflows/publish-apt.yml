name: publish-apt

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published immutable Stable tag
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-apt
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - name: Check the published release
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" |
            jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .immutable and (.draft == false) and (.prerelease == false)'
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.13.0"
      - name: Build the client and package
        env:
          ARCHITECTURE: ${{ matrix.arch }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -eu
          test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
          corepack enable
          pnpm install --frozen-lockfile
          node client/build-client.mjs
          node deploy/apt/build-package.mjs "$ARCHITECTURE" packages-out
          deb="packages-out/n624-latex_${RELEASE_TAG#v}_$ARCHITECTURE.deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = "$ARCHITECTURE"
          test "$(dpkg-deb -f "$deb" Package)" = n624-latex
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y "./$deb"
          test ! -e /opt/latex-renderer
          test ! -e /etc/latex-renderer
          test "$(/usr/bin/n624-latex --version)" = "${RELEASE_TAG#v}"
          test "$(/usr/bin/latex-render --version)" = "${RELEASE_TAG#v}"
          /usr/bin/n624-latex admin update status --help
          sudo /usr/bin/n624-latex server setup --plan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apt-${{ matrix.arch }}
          path: packages-out/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [release, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.13.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: apt-*
          merge-multiple: true
          path: packages-out
      - name: Verify release and sign repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          N624_APT_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_ORIGIN: ${{ vars.APT_ORIGIN }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" |
            jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .immutable and (.draft == false) and (.prerelease == false)'
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apt-utils
          test -n "$APT_SIGNING_KEY"
          test -n "$APT_ORIGIN"
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'gpgconf --kill gpg-agent; rm -r -- "$GNUPGHOME"' EXIT
          chmod 0700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          unset APT_SIGNING_KEY
          node deploy/apt/build-repository.mjs packages-out apt-site "$APT_ORIGIN"
          gpg --batch --export "$N624_APT_FINGERPRINT" > "$GNUPGHOME/public.gpg"
          gpgv --keyring "$GNUPGHOME/public.gpg" apt-site/dists/stable/InRelease
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apt-site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
