name: texlive-prefetch

on:
  pull_request:
    paths:
      - "renderer/TeXLivePrefetch.pm"
      - "renderer/Dockerfile.base"
      - "tests/texlive_prefetch_test.py"
      - ".github/workflows/texlive-prefetch.yml"
  push:
    branches: [main]
    paths:
      - "renderer/TeXLivePrefetch.pm"
      - "renderer/Dockerfile.base"
      - "tests/texlive_prefetch_test.py"
      - ".github/workflows/texlive-prefetch.yml"

permissions:
  contents: read

jobs:
  bounded-https-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install HTTPS test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwww-perl liblwp-protocol-https-perl openssl
      - name: Test bounded prefetch against a local HTTPS server
        run: python3 -m unittest -v tests/texlive_prefetch_test.py
