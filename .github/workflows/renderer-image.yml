name: renderer-image

on:
  pull_request:
    paths:
      - "renderer/**"
      - "deploy/security/seccomp.json"
      - "deploy/scripts/*texlive*.sh"
      - "deploy/scripts/ci-*.sh"
      - "deploy/scripts/build-language-runtime.sh"
      - "deploy/scripts/smoke-test-renderer-*.sh"
      - "tests/fixtures/svg/**"
      - ".github/workflows/renderer-image.yml"
  push:
    branches: [main]
    paths:
      - "renderer/**"
      - "deploy/security/seccomp.json"
      - "deploy/scripts/*texlive*.sh"
      - "deploy/scripts/ci-*.sh"
      - "deploy/scripts/build-language-runtime.sh"
      - "deploy/scripts/smoke-test-renderer-*.sh"
      - "tests/fixtures/svg/**"
      - ".github/workflows/renderer-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderer-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        id: buildx
      - name: Check disk before Base build
        run: sh deploy/scripts/ci-renderer-disk.sh before-base-build 12
      - name: Resolve snapshot
        id: snapshot
        run: sh deploy/scripts/resolve-texlive-snapshot.sh latest
      - name: Generate language-neutral Base profile
        env:
          TEXLIVE_REPOSITORY: ${{ steps.snapshot.outputs.repository }}
        run: sh deploy/scripts/generate-texlive-profile.sh "$TEXLIVE_REPOSITORY" renderer/texlive.profile
      - name: Build renderer image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: renderer
          file: renderer/Dockerfile.base
          no-cache: true
          pull: true
          build-args: |
            TEXLIVE_REPOSITORY=${{ steps.snapshot.outputs.repository }}
            TEXLIVE_INSTALLER_SHA512=${{ steps.snapshot.outputs.installer_sha512 }}
            TEXLIVE_PROFILE_KIND=language-neutral-maximal
          load: true
          push: false
          tags: latex-renderer:ci
          # TeX layers are several GiB each. Keep build cache on the ephemeral
          # hosted runner instead of exporting it to Actions cache storage.
      - name: Validate Base and temporary English/Japanese Runtime
        env:
          TEXLIVE_REPOSITORY: ${{ steps.snapshot.outputs.repository }}
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: sh deploy/scripts/ci-validate-texlive-base.sh latex-renderer:ci "$TEXLIVE_REPOSITORY"
      - name: Scan renderer image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: latex-renderer:ci
          scan-type: image
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # The scan remains visible on every renderer build.  Dependency and
          # secret scans in the security workflow are the blocking controls;
          # image findings are triaged against the pinned TeX snapshot.
          exit-code: "0"
      - name: Generate CycloneDX renderer image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: latex-renderer:ci
          format: cyclonedx-json
          output-file: latex-renderer-image.cdx.json
          artifact-name: latex-renderer-image.cdx.json
          upload-artifact: true
          dependency-snapshot: false
      - name: Release local Base state
        if: always()
        run: docker image rm latex-renderer:ci || true
