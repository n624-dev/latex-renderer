name: renderer-image

on:
  pull_request:
    paths:
      - "renderer/**"
      - "deploy/security/seccomp.json"
      - "deploy/scripts/*texlive*.sh"
      - "deploy/scripts/resolve-texlive-ci-snapshot.mjs"
      - "deploy/scripts/ci-*.sh"
      - "deploy/texlive-mirror/**"
      - "deploy/scripts/build-language-runtime.sh"
      - "deploy/scripts/smoke-test-renderer-*.sh"
      - "tests/fixtures/svg/**"
      - "tests/fixtures/font-cache/**"
      - "tests/fixtures/source-pipeline-renderer.mjs"
      - "tests/helpers/source-pipeline.ts"
      - "tests/source-pipeline-e2e.test.ts"
      - "tests/independent-svg-pipeline.test.ts"
      - "vitest.source-pipeline.config.ts"
      - ".github/workflows/renderer-image.yml"
  push:
    branches: [main]
    paths:
      - "renderer/**"
      - "deploy/security/seccomp.json"
      - "deploy/scripts/*texlive*.sh"
      - "deploy/scripts/resolve-texlive-ci-snapshot.mjs"
      - "deploy/scripts/ci-*.sh"
      - "deploy/texlive-mirror/**"
      - "deploy/scripts/build-language-runtime.sh"
      - "deploy/scripts/smoke-test-renderer-*.sh"
      - "tests/fixtures/svg/**"
      - "tests/fixtures/font-cache/**"
      - "tests/fixtures/source-pipeline-renderer.mjs"
      - "tests/helpers/source-pipeline.ts"
      - "tests/source-pipeline-e2e.test.ts"
      - "tests/independent-svg-pipeline.test.ts"
      - "vitest.source-pipeline.config.ts"
      - ".github/workflows/renderer-image.yml"
  workflow_dispatch:
    inputs:
      architecture:
        description: "Native validation architecture (ARM64 requires an ARM64-enabled mirror snapshot)"
        type: choice
        options: [amd64, arm64, both]
        default: both
      texlive_date:
        description: "Snapshot for comparison: latest or YYYY-MM-DD"
        type: string
        default: latest
      builder_driver:
        description: "Native Docker image store or previous container/export path"
        type: choice
        options: [docker, docker-container]
        default: docker
      format_jobs:
        description: "Runtime format generation workers (1 keeps the serial baseline)"
        type: choice
        options: ["1", "2", "4"]
        default: "4"
      database_save_batch:
        description: "Disposable Base DB checkpoints (1 selects standard saves)"
        type: choice
        options: ["1", "16", "64"]
        default: "64"

permissions:
  contents: read

concurrency:
  # Manual comparisons must not cancel push/PR validation, or one another.
  # Each comparison remains non-publishing, on its own disposable runner.
  group: renderer-image-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'validation' }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(inputs.architecture == 'amd64' && '["amd64"]' || inputs.architecture == 'arm64' && '["arm64"]' || '["amd64","arm64"]') }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      CI_RENDERER_DRIVER: ${{ inputs.builder_driver || 'docker' }}
      CI_FORMAT_JOBS: ${{ inputs.format_jobs || '4' }}
      CI_DATABASE_SAVE_BATCH: ${{ inputs.database_save_batch || '64' }}
      REQUESTED_DATE: ${{ inputs.texlive_date || 'latest' }}
      CI_ARCHITECTURE: ${{ matrix.architecture }}
      CI_FONT_CACHE_COMPARE: "1"
      # Register the private distribution hostname with the runner's log
      # masker before any step can emit a snapshot URL.
      TEXLIVE_CI_MIRROR_HOST: ${{ secrets.TEXLIVE_CI_MIRROR_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Verify native architecture (no emulation)
        run: |
          case "$CI_ARCHITECTURE:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo 'Runner architecture does not match requested validation' >&2; exit 65 ;;
          esac
      - name: Validate disposable database save settings
        run: sh deploy/scripts/ci-texlive-database-save-settings.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: env.CI_RENDERER_DRIVER == 'docker-container'
        id: buildx
        with:
          driver: docker-container
      - name: Select and verify renderer builder
        id: renderer-builder
        env:
          CONTAINER_BUILDER: ${{ steps.buildx.outputs.name }}
        run: sh deploy/scripts/ci-select-renderer-builder.sh "$CI_RENDERER_DRIVER" "$CONTAINER_BUILDER"
      - name: Check disk before Base build
        run: sh deploy/scripts/ci-renderer-disk.sh before-base-build 12
      - name: Resolve snapshot
        id: snapshot
        run: sh deploy/scripts/resolve-texlive-snapshot.sh "$REQUESTED_DATE"
      - name: Install pinned cloudflared client when mirror credentials are available
        env:
          TEXLIVE_CI_HOST: ${{ secrets.TEXLIVE_CI_HOST }}
          TEXLIVE_CI_SSH_KEY: ${{ secrets.TEXLIVE_CI_SSH_KEY }}
          TEXLIVE_CI_KNOWN_HOSTS: ${{ secrets.TEXLIVE_CI_KNOWN_HOSTS }}
          TEXLIVE_CI_ACCESS_CLIENT_ID: ${{ secrets.TEXLIVE_CI_ACCESS_CLIENT_ID }}
          TEXLIVE_CI_ACCESS_CLIENT_SECRET: ${{ secrets.TEXLIVE_CI_ACCESS_CLIENT_SECRET }}
        run: |
          configured=0
          for value in "$TEXLIVE_CI_HOST" "$TEXLIVE_CI_SSH_KEY" "$TEXLIVE_CI_KNOWN_HOSTS" "$TEXLIVE_CI_ACCESS_CLIENT_ID" "$TEXLIVE_CI_ACCESS_CLIENT_SECRET" "$TEXLIVE_CI_MIRROR_HOST"; do
            [ -n "$value" ] && configured=$((configured + 1))
          done
          if [ -z "$TEXLIVE_CI_SSH_KEY$TEXLIVE_CI_ACCESS_CLIENT_ID$TEXLIVE_CI_ACCESS_CLIENT_SECRET" ]; then
            exit 0
          fi
          [ "$configured" -eq 6 ] || { echo 'Partial TeX Live CI mirror configuration' >&2; exit 64; }
          sh deploy/scripts/install-cloudflared-client.sh
      - name: Reserve exact CI mirror snapshot when credentials are available
        id: mirror
        env:
          TEXLIVE_CI_HOST: ${{ secrets.TEXLIVE_CI_HOST }}
          TEXLIVE_CI_USER: ${{ secrets.TEXLIVE_CI_USER }}
          TEXLIVE_CI_SSH_KEY: ${{ secrets.TEXLIVE_CI_SSH_KEY }}
          TEXLIVE_CI_KNOWN_HOSTS: ${{ secrets.TEXLIVE_CI_KNOWN_HOSTS }}
          TEXLIVE_CI_ACCESS_CLIENT_ID: ${{ secrets.TEXLIVE_CI_ACCESS_CLIENT_ID }}
          TEXLIVE_CI_ACCESS_CLIENT_SECRET: ${{ secrets.TEXLIVE_CI_ACCESS_CLIENT_SECRET }}
        run: |
          echo 'repository=${{ steps.snapshot.outputs.repository }}' >> "$GITHUB_OUTPUT"
          configured=0
          for value in "$TEXLIVE_CI_HOST" "$TEXLIVE_CI_SSH_KEY" "$TEXLIVE_CI_KNOWN_HOSTS" "$TEXLIVE_CI_ACCESS_CLIENT_ID" "$TEXLIVE_CI_ACCESS_CLIENT_SECRET" "$TEXLIVE_CI_MIRROR_HOST"; do
            [ -n "$value" ] && configured=$((configured + 1))
          done
          if [ -z "$TEXLIVE_CI_SSH_KEY$TEXLIVE_CI_ACCESS_CLIENT_ID$TEXLIVE_CI_ACCESS_CLIENT_SECRET" ]; then
            exit 0
          fi
          [ "$configured" -eq 6 ] || { echo 'Partial TeX Live CI mirror configuration' >&2; exit 64; }
          if [ "$configured" -eq 6 ]; then
            sh deploy/scripts/ci-texlive-mirror-lease.sh acquire \
              '${{ steps.snapshot.outputs.date }}' '${{ steps.snapshot.outputs.installer_sha512 }}' "$CI_ARCHITECTURE" \
              '${{ steps.snapshot.outputs.snapshot_id }}' '${{ steps.snapshot.outputs.database_sha512 }}'
          fi
      - name: Generate language-neutral Base profile
        env:
          TEXLIVE_DOWNLOAD_REPOSITORY: ${{ steps.mirror.outputs.repository }}
        run: sh deploy/scripts/generate-texlive-profile.sh "$TEXLIVE_DOWNLOAD_REPOSITORY" renderer/texlive.profile
      - name: Build renderer image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          TEXLIVE_DOWNLOAD_REPOSITORY: ${{ steps.mirror.outputs.repository }}
        with:
          builder: ${{ steps.renderer-builder.outputs.name }}
          context: renderer
          file: renderer/Dockerfile.base
          no-cache: true
          pull: true
          build-args: |
            TEXLIVE_REPOSITORY=${{ steps.snapshot.outputs.repository }}
            TEXLIVE_INSTALLER_SHA512=${{ steps.snapshot.outputs.installer_sha512 }}
            TEXLIVE_PROFILE_KIND=language-neutral-maximal
            TEXLIVE_DATABASE_SAVE_BATCH=${{ env.CI_DATABASE_SAVE_BATCH }}
            TEXLIVE_DISPOSABLE_CI=1
          secret-envs: |
            texlive_download_repository=TEXLIVE_DOWNLOAD_REPOSITORY
          load: true
          push: false
          tags: latex-renderer:ci
          # TeX layers are several GiB each. Keep build cache on the ephemeral
          # hosted runner instead of exporting it to Actions cache storage.
      - name: Validate Base and temporary English/Japanese Runtime
        env:
          TEXLIVE_DOWNLOAD_REPOSITORY: ${{ steps.mirror.outputs.repository }}
          TEXLIVE_REPOSITORY: ${{ steps.snapshot.outputs.repository }}
          BUILDX_BUILDER: ${{ steps.renderer-builder.outputs.name }}
        run: sh deploy/scripts/ci-validate-texlive-base.sh latex-renderer:ci "$TEXLIVE_DOWNLOAD_REPOSITORY" "$TEXLIVE_REPOSITORY"
      - name: Scan renderer image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: false
          image-ref: latex-renderer:ci
          scan-type: image
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # The scan remains visible on every renderer build.  Dependency and
          # secret scans in the security workflow are the blocking controls;
          # image findings are triaged against the pinned TeX snapshot.
          exit-code: "0"
      - name: Generate CycloneDX renderer image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: latex-renderer:ci
          format: cyclonedx-json
          output-file: latex-renderer-image.cdx.json
          artifact-name: latex-renderer-image-${{ env.CI_ARCHITECTURE }}.cdx.json
          upload-artifact: true
          dependency-snapshot: false
      - name: Release local Base state
        if: always()
        run: docker image rm latex-renderer:ci || true
      - name: Release CI mirror reservation
        if: always() && steps.mirror.outputs.token != ''
        env:
          TEXLIVE_CI_HOST: ${{ secrets.TEXLIVE_CI_HOST }}
          TEXLIVE_CI_USER: ${{ secrets.TEXLIVE_CI_USER }}
          TEXLIVE_CI_SSH_KEY: ${{ secrets.TEXLIVE_CI_SSH_KEY }}
          TEXLIVE_CI_KNOWN_HOSTS: ${{ secrets.TEXLIVE_CI_KNOWN_HOSTS }}
          TEXLIVE_CI_ACCESS_CLIENT_ID: ${{ secrets.TEXLIVE_CI_ACCESS_CLIENT_ID }}
          TEXLIVE_CI_ACCESS_CLIENT_SECRET: ${{ secrets.TEXLIVE_CI_ACCESS_CLIENT_SECRET }}
        run: sh deploy/scripts/ci-texlive-mirror-lease.sh release '${{ steps.mirror.outputs.token }}' '${{ steps.mirror.outputs.owner }}'
