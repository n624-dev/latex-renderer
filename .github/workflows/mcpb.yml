name: mcpb

on:
  pull_request:
    paths:
      - "apps/mcp-server/**"
      - "packages/mcp-core/**"
      - "packages/log-parser/**"
      - "packages/client-core/**"
      - "packages/api-client/**"
      - "packages/setup-core/**"
      - "packages/setup-web/**"
      - "tests/artifact-transaction*"
      - "tests/fixtures/artifact-transaction-child.mjs"
      - "tests/client-audit-integration.test.ts"
      - "tests/client-launcher-endpoints.test.ts"
      - "tests/windows-setup-layout.test.ts"
      - "tests/mcpb-openssl.test.ts"
      - "client/unix/**"
      - "client/windows/**"
      - "client/mcpb/**"
      - "client/*mcpb*.mjs"
      - "client/*mcpb*.d.mts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/mcpb.yml"
  push:
    branches: [main]
    paths:
      - "apps/mcp-server/**"
      - "packages/mcp-core/**"
      - "packages/log-parser/**"
      - "packages/client-core/**"
      - "packages/api-client/**"
      - "packages/setup-core/**"
      - "packages/setup-web/**"
      - "tests/artifact-transaction*"
      - "tests/fixtures/artifact-transaction-child.mjs"
      - "tests/client-audit-integration.test.ts"
      - "tests/client-launcher-endpoints.test.ts"
      - "tests/windows-setup-layout.test.ts"
      - "tests/mcpb-openssl.test.ts"
      - "client/unix/**"
      - "client/windows/**"
      - "client/mcpb/**"
      - "client/*mcpb*.mjs"
      - "client/*mcpb*.d.mts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/mcpb.yml"

permissions:
  contents: read

jobs:
  clean-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
          - runner: windows-2025
            platform: win32
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared client libraries
        run: pnpm --filter @latex-renderer/setup-core... --filter @latex-renderer/client-core... --filter @latex-renderer/api-client... --filter @latex-renderer/mcp-core... --filter @latex-renderer/log-parser... build
      - name: Exercise client integrity, recovery, and native launchers
        run: pnpm exec vitest run packages/setup-core/src/windows-launchers.test.ts packages/client-core/src/open-local-target.test.ts tests/artifact-transaction.test.ts tests/artifact-transaction-faults.test.ts tests/artifact-transaction-platform.test.ts tests/artifact-transaction-stale-cleanup.test.ts tests/client-audit-integration.test.ts tests/client-launcher-endpoints.test.ts packages/api-client/src/index.test.ts tests/windows-setup-layout.test.ts packages/mcp-core/src/index.test.ts packages/log-parser/src/index.test.ts
      - name: Select OpenSSL on macOS
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Select verified runner OpenSSL on Windows
        if: runner.os == 'Windows'
        run: node client/select-mcpb-openssl.mjs
      - name: Verify OpenSSL selection safeguards
        run: pnpm exec vitest run tests/mcpb-openssl.test.ts
      - name: Validate, pack, sign, and verify MCPB
        run: pnpm build:mcpb && pnpm verify:mcpb
      - name: Exercise clean local server install
        run: pnpm test:mcpb:clean -- ${{ matrix.platform }}
