name: debian-snapshot-diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Compare signed metadata over HTTP and HTTPS without installation
        run: node deploy/ci/probe-debian-snapshot.mjs 20260812T235959Z
