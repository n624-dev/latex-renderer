name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Enable Corepack
        run: corepack enable
      - name: Install backup integration-test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes age
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, test, and lint
        run: pnpm check
      - name: Build workspaces and Windows distribution
        run: pnpm build
      - name: Verify signed MCPB distribution
        run: pnpm verify:mcpb
      - name: Verify Gateway Worker bundle
        run: pnpm --filter @latex-renderer/gateway-worker build
