name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Enable Corepack
        run: corepack enable
      - name: Install backup integration-test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes age acl libarchive-tools nginx-light
      - name: Install dependencies
        run: node deploy/ci/measure-phase.mjs dependencies -- pnpm install --frozen-lockfile
      # Same checks as pnpm check, measured separately. One fresh recursive
      # build also creates the client/Windows/MCPB assets and both Worker bundles.
      # Only this checkout/job's outputs are reused; there is no build cache.
      - name: Typecheck
        run: node deploy/ci/measure-phase.mjs typecheck -- pnpm typecheck
      - name: Build all workspaces and client distributions once
        run: node deploy/ci/measure-phase.mjs build -- pnpm build:workspaces
      - name: Check documentation
        run: node deploy/ci/measure-phase.mjs docs -- pnpm check:docs
      - name: Run regression and integration tests
        run: node deploy/ci/measure-phase.mjs test -- pnpm test
      - name: Lint
        run: node deploy/ci/measure-phase.mjs lint -- pnpm lint
      - name: Install Chromium for Web regression tests
        run: node deploy/ci/measure-phase.mjs chromium -- pnpm exec playwright install --with-deps --only-shell chromium
      - name: Verify Web selection, batches, and authentication UI in Chromium
        run: node deploy/ci/measure-phase.mjs browser -- pnpm test:browser:built
      - name: Verify signed MCPB distribution
        run: node deploy/ci/measure-phase.mjs mcpb -- pnpm verify:mcpb
