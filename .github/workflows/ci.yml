name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit-touch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_BROWSER: webkit
      TEST_BROWSER_TOUCH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Install and build Web test dependencies without a cache
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @latex-renderer/web... build
      - name: Install WebKit and its disposable-runner prerequisites
        run: pnpm exec playwright install --with-deps webkit
      - name: Verify shipped UI with WebKit and touch enabled
        run: pnpm test:browser:built

  native-arm64:
    # Separate from renderer publication: exercise native Node/SQLite/CLI and
    # host integration code without treating x86 emulation as ARM acceptance.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Verify native ARM64 and install test prerequisites
        run: |
          test "$(uname -m)" = aarch64
          node -e 'if (process.arch !== "arm64") throw Error("Native ARM64 Node required")'
          corepack enable
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes age acl libarchive-tools nginx-light unzip
      - name: Install without an Actions dependency cache
        run: pnpm install --frozen-lockfile
      - name: Build native services and client
        run: pnpm --filter '!@latex-renderer/public-web' --filter '!@latex-renderer/gateway-worker' -r build && pnpm build:client
      - name: Native API, SQLite, setup, update and recovery regression tests
        run: pnpm test
      - name: Verify native client package clean install
        run: pnpm test:mcpb:clean -- linux

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Enable Corepack
        run: corepack enable
      - name: Install backup integration-test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes age acl libarchive-tools nginx-light unzip
      - name: Install dependencies
        run: node deploy/ci/measure-phase.mjs dependencies -- pnpm install --frozen-lockfile
      # Same checks as pnpm check, measured separately. One fresh recursive
      # build also creates the client/Windows/MCPB assets and both Worker bundles.
      # Only this checkout/job's outputs are reused; there is no build cache.
      - name: Typecheck
        run: node deploy/ci/measure-phase.mjs typecheck -- pnpm typecheck
      - name: Build all workspaces and client distributions once
        run: node deploy/ci/measure-phase.mjs build -- pnpm build:workspaces
      - name: Check documentation
        run: node deploy/ci/measure-phase.mjs docs -- pnpm check:docs
      - name: Run regression and integration tests
        run: node deploy/ci/measure-phase.mjs test -- pnpm test
      - name: Lint
        run: node deploy/ci/measure-phase.mjs lint -- pnpm lint
      - name: Install Chromium for Web regression tests
        run: node deploy/ci/measure-phase.mjs chromium -- pnpm exec playwright install --with-deps --only-shell chromium
      - name: Verify Web selection, batches, and authentication UI in Chromium
        run: node deploy/ci/measure-phase.mjs browser -- pnpm test:browser:built
      - name: Verify signed MCPB distribution
        run: node deploy/ci/measure-phase.mjs mcpb -- pnpm verify:mcpb
