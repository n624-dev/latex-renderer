name: server-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag, for example v1.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: server-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-upload-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Enable Corepack
        run: corepack enable
      - name: Validate tag and source
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=${RELEASE_TAG#v}
          [[ $(node -p 'require("./package.json").version') == "$version" ]]
          [[ $(git tag --points-at HEAD) == *"$RELEASE_TAG"* ]]
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build:client
      - name: Build versioned server source bundle
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sh deploy/scripts/build-server-release-assets.sh \
            "$RELEASE_TAG" "$RUNNER_TEMP/release-assets"
      - name: Require immutable-release protection and upload to draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh api --hostname github.com \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            repos/n624-dev/latex-renderer/immutable-releases \
            --jq 'select(.enabled == true) | .enabled' | grep -qx true
          version=${RELEASE_TAG#v}
          if ! gh api --paginate repos/n624-dev/latex-renderer/releases \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == true) | .id" \
            | grep -q .; then
            gh release create "$RELEASE_TAG" \
              --repo n624-dev/latex-renderer \
              --verify-tag \
              --draft \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/release-assets/latex-renderer-server-$version.tar.gz" \
            "$RUNNER_TEMP/release-assets/latex-renderer-client-$version.zip" \
            "$RUNNER_TEMP/release-assets/latex-renderer-local-$version.mcpb" \
            "$RUNNER_TEMP/release-assets/SHA256SUMS" \
            --repo n624-dev/latex-renderer \
            --clobber
          echo "Server and client assets uploaded to the draft. Review every asset and the generated notes, then publish the draft to make it immutable."
