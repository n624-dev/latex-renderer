name: server-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag, for example vX.Y.Z-rc.N or vX.Y.Z"
        required: true
        type: string
      release_kind:
        description: "Candidate is tested on the production host; stable requires that validated candidate"
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - stable
      candidate_tag:
        description: "Required for stable: immutable prerelease tag with the same X.Y.Z core"
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: server-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.assets.outputs.artifact-id }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Enable Corepack
        run: corepack enable
      - name: Install integration-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes age acl
      - name: Validate tag and source
        id: source
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: ${{ inputs.release_kind }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$RELEASE_KIND" in
            candidate)
              [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$ ]]
              [[ -z "$CANDIDATE_TAG" ]]
              ;;
            stable)
              [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
              [[ "$CANDIDATE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$ ]]
              [[ "${CANDIDATE_TAG%-rc.*}" == "$RELEASE_TAG" ]]
              candidate_json=$(gh api "repos/n624-dev/latex-renderer/releases/tags/$CANDIDATE_TAG")
              candidate_version=${CANDIDATE_TAG#v}
              jq -e --arg tag "$CANDIDATE_TAG" '
                .tag_name == $tag and
                .draft == false and
                .prerelease == true and
                .immutable == true
              ' <<<"$candidate_json" >/dev/null
              candidate_asset="latex-renderer-server-$candidate_version.tar.gz"
              jq -e --arg asset "$candidate_asset" \
                '[.assets[].name] | any(. == $asset)' \
                <<<"$candidate_json" >/dev/null
              candidate_digest=$(jq -r --arg asset "$candidate_asset" \
                '.assets[] | select(.name == $asset) | .digest' \
                <<<"$candidate_json")
              [[ "$candidate_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              candidate_dir="$RUNNER_TEMP/validated-candidate"
              mkdir -p "$candidate_dir"
              gh release download "$CANDIDATE_TAG" \
                --repo n624-dev/latex-renderer \
                --pattern "$candidate_asset" \
                --dir "$candidate_dir"
              [[ $(sha256sum "$candidate_dir/$candidate_asset" | cut -d' ' -f1) == "${candidate_digest#sha256:}" ]]
              gh attestation verify "$candidate_dir/$candidate_asset" \
                --repo n624-dev/latex-renderer \
                --signer-workflow n624-dev/latex-renderer/.github/workflows/server-release.yml \
                --source-ref "refs/tags/$CANDIDATE_TAG" \
                --predicate-type https://slsa.dev/provenance/v1 \
                --deny-self-hosted-runners
              node deploy/scripts/verify-release-candidate-promotion.mjs \
                "$CANDIDATE_TAG" "$RELEASE_TAG"
              ;;
            *) exit 64 ;;
          esac
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
          version=${RELEASE_TAG#v}
          [[ $(node -p 'require("./package.json").version') == "$version" ]]
          [[ $(git tag --points-at HEAD) == *"$RELEASE_TAG"* ]]
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build:client
      - name: Build versioned server source bundle
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sh deploy/scripts/build-server-release-assets.sh \
            "$RELEASE_TAG" "$RUNNER_TEMP/release-assets" "$CANDIDATE_TAG"
      - name: Attest release assets with Sigstore provenance
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: ${{ runner.temp }}/release-assets/SHA256SUMS
      - name: Verify release attestations before upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          for asset in \
            "$RUNNER_TEMP/release-assets/latex-renderer-server-$version.tar.gz" \
            "$RUNNER_TEMP/release-assets/latex-renderer-client-$version.zip" \
            "$RUNNER_TEMP/release-assets/latex-renderer-local-$version.mcpb"; do
            gh attestation verify "$asset" \
              --repo n624-dev/latex-renderer \
              --signer-workflow n624-dev/latex-renderer/.github/workflows/server-release.yml \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --deny-self-hosted-runners
          done
      - name: Verify pinned pre-publication server artifact
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/release-assets/latex-renderer-server-${RELEASE_TAG#v}.tar.gz"
          digest="sha256:$(sha256sum "$artifact" | cut -d' ' -f1)"
          node deploy/scripts/ci-release-artifact.mjs \
            "$artifact" "$RELEASE_TAG" "$(git rev-parse HEAD)" "$digest" "$ATTESTATION_BUNDLE"
          # Normalize the action's single JSON bundle to a compact JSONL record.
          node -e 'const fs=require("node:fs");fs.writeFileSync(process.argv[2],JSON.stringify(JSON.parse(fs.readFileSync(process.argv[1],"utf8")))+"\n")' \
            "$ATTESTATION_BUNDLE" "$RUNNER_TEMP/release-assets/PROVENANCE.jsonl"
          cp "$RUNNER_TEMP/release-assets/SHA256SUMS" "$RUNNER_TEMP/release-assets/VERIFIED-SHA256SUMS"
      - name: Transfer immutable release artifacts (not a build cache)
        id: assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-assets/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  update-e2e:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        baseline: [legacy, installed]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      attestations: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
          digest-mismatch: error
      - name: Provision disposable standalone validation host
        run: |
          set -euo pipefail
          sh deploy/scripts/ci-renderer-disk.sh before-update-e2e 12
          sudo install -m 0755 "$(command -v node)" /usr/local/bin/node
          sudo npm install --global --prefix /usr/local corepack@0.34.6
          mkdir -p "$HOME/.local/share/pnpm/bin"
          /usr/local/bin/corepack enable --install-directory "$HOME/.local/share/pnpm/bin" pnpm
          sudo env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            /usr/local/bin/node deploy/ci/provision-update-host.mjs
      - name: Upgrade previous RC, validate data/rendering, exercise Updater recovery
        env:
          CI_UPDATE_BASELINE: ${{ matrix.baseline }}
          CI_RELEASE_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/release-assets/latex-renderer-server-${RELEASE_TAG#v}.tar.gz"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum --strict --check VERIFIED-SHA256SUMS)
          digest="sha256:$(sha256sum "$artifact" | cut -d' ' -f1)"
          sudo --preserve-env=CI_RELEASE_GITHUB_TOKEN env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            CI_UPDATE_BASELINE="$CI_UPDATE_BASELINE" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/latex-renderer-ci.crt \
            /usr/local/bin/node deploy/ci/update-e2e.mjs \
            "$artifact" "$RELEASE_TAG" "$RELEASE_COMMIT" "$digest" "$RUNNER_TEMP/release-assets/PROVENANCE.jsonl"
      - name: Bounded, redacted disposable-host diagnostics
        if: failure()
        run: |
          sudo env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            /usr/local/bin/node deploy/ci/update-diagnostics.mjs

  upload-draft:
    needs: [build, update-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
          digest-mismatch: error
      - name: Reverify the exact tested release bytes before Draft upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release-assets"
          sha256sum --strict --check VERIFIED-SHA256SUMS
          for asset in *.tar.gz *.zip *.mcpb; do
            gh attestation verify "$asset" --bundle PROVENANCE.jsonl --repo n624-dev/latex-renderer \
              --signer-workflow n624-dev/latex-renderer/.github/workflows/server-release.yml \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$RELEASE_COMMIT" \
              --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners
          done
      # GITHUB_TOKEN can manage draft release assets with contents:write, but
      # cannot read repository Administration settings. The maintainer verifies
      # immutable-release protection before dispatch and again before publish.
      - name: Upload all release assets to draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          # Upload precisely the verified bytes. Never rebuild after this gate.
          (cd "$RUNNER_TEMP/release-assets" && sha256sum --strict --check VERIFIED-SHA256SUMS)
          cmp "$RUNNER_TEMP/release-assets/VERIFIED-SHA256SUMS" "$RUNNER_TEMP/release-assets/SHA256SUMS"
          if ! gh api --paginate repos/n624-dev/latex-renderer/releases \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == true) | .id" \
            | grep -q .; then
            gh release create "$RELEASE_TAG" \
              --repo n624-dev/latex-renderer \
              --verify-tag \
              --draft \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/release-assets/latex-renderer-server-$version.tar.gz" \
            "$RUNNER_TEMP/release-assets/latex-renderer-client-$version.zip" \
            "$RUNNER_TEMP/release-assets/latex-renderer-local-$version.mcpb" \
            "$RUNNER_TEMP/release-assets/SHA256SUMS" \
            --repo n624-dev/latex-renderer \
            --clobber
          gh release view "$RELEASE_TAG" \
            --repo n624-dev/latex-renderer \
            --json isDraft \
            --jq 'select(.isDraft == true) | .isDraft' \
            | grep -qx true
          if [[ "${{ inputs.release_kind }}" == candidate ]]; then
            echo "Review every asset, then publish as an immutable prerelease with latest disabled. Apply it explicitly to the validation host before creating the stable tag."
          else
            echo "The immutable candidate and source-equivalence gate passed. Review every asset and notes, then publish the stable draft."
          fi
