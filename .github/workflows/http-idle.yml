name: http-idle
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/http-idle.yml
      - deploy/ci/http-idle-fixture.mjs
      - deploy/ci/http-socket-activation.mjs
      - deploy/scripts/http-*.mjs
      - deploy/systemd/*.socket
      - deploy/systemd/latex-renderer-*.service
      - apps/*/src/server.ts
permissions:
  contents: read
concurrency:
  group: http-idle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  socket-activation:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Exercise real systemd activation, drain, restart and legacy transition
        run: sudo "$(command -v node)" deploy/ci/http-socket-activation.mjs
