# Merge the zones into the existing http{} context. Replace example.org and
# certificate paths. The authority API name MUST be outside lan.example.org.
limit_req_zone $binary_remote_addr zone=lan_authority_requests:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=lan_authority_connections:1m;
server {
    listen 443 ssl;
    server_name akebi.example.org;
    ssl_certificate /etc/letsencrypt/live/akebi-authority/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akebi-authority/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    client_body_timeout 10s;
    send_timeout 10s;
    access_log off;
    error_log syslog:server=unix:/dev/log warn;
    location / {
        limit_req zone=lan_authority_requests burst=20 nodelay;
        limit_conn lan_authority_connections 8;
        proxy_pass http://127.0.0.1:3181;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Latex-Renderer-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }
}
