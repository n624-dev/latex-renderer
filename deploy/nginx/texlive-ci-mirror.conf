server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name texlive-ci.example.invalid;
    access_log off;
    return 301 https://texlive-ci.example.invalid$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate /etc/nginx/ssl/texlive-ci.example.invalid.crt;
    ssl_certificate_key /etc/nginx/ssl/texlive-ci.example.invalid.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name texlive-ci.example.invalid;
    ssl_certificate /etc/nginx/ssl/texlive-ci.example.invalid.crt;
    ssl_certificate_key /etc/nginx/ssl/texlive-ci.example.invalid.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/texlive-ci;
    autoindex off;
    access_log off;

    location = /latest.json {
        default_type application/json;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ "^/snapshots/tl20[0-9]{2}-[0-9a-f]{16}-[0-9a-f]{16}-[0-9a-f]{16}-v[1-9][0-9]*/tlnet(?:/.*)?$" {
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
        disable_symlinks on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / { return 404; }
}
