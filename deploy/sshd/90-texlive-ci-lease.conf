Match User texlive-ci-lease
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    AllowTcpForwarding no
    PermitTunnel no
    X11Forwarding no
    GatewayPorts no
    ForceCommand /usr/bin/sudo -n -u texlive-ci -- /usr/local/libexec/texlive-ci-ssh
