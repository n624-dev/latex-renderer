openapi: 3.1.0
info:
  title: LaTeX Renderer Job Transfer API
  version: 0.3.0
  description: Upload project ZIP files, read job state, and download results using short-lived tickets.
servers:
  - url: /
paths:
  /api/v1/sources/{sourceId}/content:
    put:
      summary: Upload and validate immutable Source ZIP content
      security: [{ ticket: [] }]
      parameters:
        - in: path
          name: sourceId
          required: true
          schema: { type: string, pattern: "^source_[a-f0-9]{32}$" }
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Source is ready }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/jobs/{jobId}/source:
    put:
      summary: Upload the project ZIP
      security: [{ ticket: [] }]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Upload accepted and job queued }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/jobs/{jobId}:
    get:
      summary: Get job state
      security: [{ ticket: [] }]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200":
          description: Job state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Mark a terminal job for deletion
      security: [{ ticket: [] }]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "202": { description: Deletion requested }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/jobs/{jobId}/cancel:
    post:
      summary: Request cancellation
      security: [{ ticket: [] }]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "202": { description: Cancellation requested }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/jobs/{jobId}/artifacts/{path}:
    get:
      summary: Download an artifact
      security: [{ ticket: [] }]
      parameters:
        - $ref: "#/components/parameters/JobId"
        - in: path
          name: path
          required: true
          description: Nested relative artifact path, for example svg/objects/math-000001.svg.
          schema: { type: string, minLength: 1 }
      responses:
        "200": { description: Artifact bytes }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/jobs/{jobId}/previews/{page}:
    get:
      summary: Download a page preview
      security: [{ ticket: [] }]
      parameters:
        - $ref: "#/components/parameters/JobId"
        - in: path
          name: page
          required: true
          schema: { type: string, pattern: '^page-[0-9]{1,3}\.png$' }
      responses:
        "200": { description: PNG preview }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  parameters:
    JobId:
      in: path
      name: jobId
      required: true
      schema: { type: string, pattern: "^job_[a-f0-9]{32}$" }
  schemas:
    Job:
      type: object
      required:
        [
          id,
          status,
          sourceSize,
          sourceSha256,
          sourceId,
          entrypoint,
          outputs,
          createdAt,
          updatedAt,
          errorCode,
          errorMessage,
          retentionExpiresAt,
          artifacts,
          previews,
        ]
      properties:
        id: { type: string }
        status:
          type: string
          enum:
            [
              reserved,
              uploading,
              queued,
              validating,
              running,
              succeeded,
              failed,
              timeout,
              canceled,
              rejected,
              deleting,
              deleted,
              expired,
            ]
        sourceSize: { type: integer, minimum: 0 }
        sourceSha256: { type: string }
        sourceId: { type: [string, "null"] }
        entrypoint: { type: string }
        outputs:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, enum: [pdf, svg] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        errorCode: { type: [string, "null"] }
        errorMessage: { type: [string, "null"] }
        retentionExpiresAt: { type: [string, "null"], format: date-time }
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/JobArtifact" }
        previews:
          type: array
          items: { $ref: "#/components/schemas/JobArtifact" }
    JobArtifact:
      type: object
      required: [type, relativePath, size, sha256, createdAt, downloadUrl]
      properties:
        type:
          type: string
          enum: [pdf, log, errors, dependencies, preview, svg, svg_manifest]
        relativePath: { type: string }
        size: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        createdAt: { type: string, format: date-time }
        downloadUrl: { type: string, pattern: "^/api/v1/jobs/" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  securitySchemes:
    ticket:
      type: http
      scheme: bearer
      bearerFormat: JWT
