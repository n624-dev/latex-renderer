openapi: 3.1.0
info:
  title: LaTeX Renderer Job Creation API
  version: 0.4.0
  description: Create temporary render jobs, manage saved Projects and renew job-operation tickets.
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      summary: Check Gateway availability
      security: []
      responses:
        "200": { description: Gateway is available }
        "503": { description: Service is temporarily unavailable }
    head:
      summary: Check Gateway availability without a response body
      security: []
      responses:
        "200": { description: Gateway is available }
        "503": { description: Service is temporarily unavailable }
  /api/v1/projects:
    get:
      summary: List saved Projects owned by the API key's user
      security: [{ renderApiKey: [] }]
      parameters:
        - { in: query, name: cursor, schema: { type: string } }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
      responses:
        "200":
          {
            description: Paginated Project summaries; nextCursor is null at the end,
          }
    post:
      summary: Create a saved Project
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201": { description: Project ID created }
  /api/v1/projects/{projectId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: Read a saved Project's revisions and bounded Job history
      security: [{ renderApiKey: [] }]
      parameters:
        - { in: query, name: cursor, schema: { type: string } }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
      responses:
        "200":
          {
            description: Project detail with immutable revision,
            Source and Job IDs,
          }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Rename a saved Project without rewriting revisions
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200": { description: Updated Project ID and display name }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Hide a saved Project; Source and Job retention remains independent
      security: [{ renderApiKey: [] }]
      responses:
        "200": { description: Project ID and deleted flag }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/document-state:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: Read document conditions and the adopted revision
      description: Requires the render:project:state:read scope and ownership of the Project.
      security: [{ renderApiKey: [] }]
      parameters:
        - in: query
          name: conditionsVersion
          description: Read a specific historical conditions version.
          schema: { type: integer, minimum: 1 }
        - in: query
          name: history
          description: URL-encode a JSON object to include one revision's change history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revisionId]
                properties:
                  revisionId:
                    { type: string, pattern: "^revision_[a-f0-9]{32}$" }
                  offset: { type: integer, minimum: 0 }
      responses:
        "200":
          {
            description: Conditions and current adoption with optional revision changes,
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/document-state/conditions:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    patch:
      summary: Replace document conditions at the expected version
      description: Requires the render:project:state:write scope and ownership of the Project.
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, entries]
              properties:
                expectedVersion: { type: integer, minimum: 0 }
                entries:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [kind, basis, text]
                    properties:
                      kind:
                        {
                          type: string,
                          enum:
                            [
                              purpose,
                              format,
                              required,
                              excluded,
                              change,
                              preserve,
                              unresolved,
                            ],
                        }
                      basis:
                        {
                          type: string,
                          enum:
                            [user_specified, existing_document, unconfirmed],
                        }
                      text: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200": { description: Current conditions version and change status }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/document-state/adoption:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Set or clear the explicitly adopted revision
      description: Requires the render:project:state:write scope and ownership of the Project.
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revisionId, expectedRevisionId]
              properties:
                revisionId:
                  { type: [string, "null"], pattern: "^revision_[a-f0-9]{32}$" }
                expectedRevisionId:
                  { type: [string, "null"], pattern: "^revision_[a-f0-9]{32}$" }
      responses:
        "200": { description: Project and adopted revision ID }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/pdf-reviews:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: List recorded PDF reviews
      description: Requires the render:project:state:read scope and ownership of the Project.
      security: [{ renderApiKey: [] }]
      parameters:
        - in: query
          name: offset
          schema: { type: integer, minimum: 0 }
      responses:
        "200": { description: Page of reviews with nextOffset }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Record checks for an exact saved revision and Job PDF
      description: Requires the render:project:state:write scope and ownership of the Project.
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  revisionId,
                  jobId,
                  pdfSha256,
                  conditionsVersion,
                  guideVersion,
                  checks,
                ]
              properties:
                revisionId: { type: string, pattern: "^revision_[a-f0-9]{32}$" }
                jobId: { type: string, pattern: "^job_[a-f0-9]{32}$" }
                pdfSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
                conditionsVersion: { type: [integer, "null"], minimum: 1 }
                guideVersion: { type: [string, "null"], maxLength: 128 }
                checks:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [type, status]
                    properties:
                      type:
                        {
                          type: string,
                          enum: [machine, visual, source_comparison],
                        }
                      status:
                        {
                          type: string,
                          enum:
                            [
                              passed,
                              needs_attention,
                              not_checked,
                              unavailable,
                              accepted_issue,
                            ],
                        }
                      pages:
                        type: array
                        maxItems: 100
                        items: { type: integer, minimum: 1, maximum: 100 }
                      note: { type: string, maxLength: 1000 }
      responses:
        "200": { description: Recorded PDF review }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/storage-usage:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: Read logical storage usage and account quota
      description: Requires the render:project:read scope and ownership of the Project.
      security: [{ renderApiKey: [] }]
      responses:
        "200": { description: Project and user storage totals in bytes }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/revision-protection:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Set or clear explicit protection for a saved revision
      description: Requires the render:create scope and ownership of the Project.
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revisionId, protected]
              properties:
                revisionId: { type: string, pattern: "^revision_[a-f0-9]{32}$" }
                protected: { type: boolean }
      responses:
        "200": { description: Project, revision, and protection status }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/revision-cleanup/plan:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Plan cleanup for selected saved revisions
      description: Requires the render:project:read scope and ownership of the Project.
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revisionIds]
              properties:
                revisionIds:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items: { type: string, pattern: "^revision_[a-f0-9]{32}$" }
      responses:
        "200":
          {
            description: Cleanup plan with planHash,
            protection reasons,
            and estimated reclaimable Source bytes,
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/revision-cleanup/apply:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Apply cleanup for the confirmed selection and current plan hash
      description: Requires the render:project:delete scope and ownership of the Project.
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revisionIds, planHash]
              properties:
                revisionIds:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items: { type: string, pattern: "^revision_[a-f0-9]{32}$" }
                planHash: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200":
          {
            description: Removed revision IDs and estimated reclaimable Source bytes,
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/revisions/{revisionId}/source.zip:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/RevisionId" }
    get:
      summary: Download the exact saved revision Source ZIP
      description: Requires the render:project:read scope and ownership of the Project.
      security: [{ renderApiKey: [] }]
      responses:
        "200":
          description: Saved Source ZIP
          headers:
            Content-Length:
              schema: { type: integer, minimum: 0 }
            X-Source-Zip-Size:
              description: Size in bytes, including when the response is streamed without Content-Length.
              schema: { type: integer, minimum: 0 }
            Content-Disposition:
              description: Attachment with filename <revisionId>.zip.
              schema: { type: string }
            ETag:
              description: Quoted SHA-256 of the Source ZIP.
              schema: { type: string }
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/draft:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: Get the version and file list of a shared draft
      description: Requires the render:draft:read scope.
      security: [{ renderApiKey: [] }]
      responses:
        "200":
          {
            description: Shared draft metadata or a null draft when none exists,
          }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/draft/file:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      summary: Read a page of UTF-8 text from an exact draft version
      description: Requires the render:draft:read scope. Follow nextOffset to continue reading in UTF-16 code units.
      security: [{ renderApiKey: [] }]
      parameters:
        - {
            in: query,
            name: version,
            required: true,
            schema: { type: integer, minimum: 1 },
          }
        - {
            in: query,
            name: path,
            required: true,
            schema: { type: string, maxLength: 2048 },
          }
        - { in: query, name: offset, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { description: Draft file text and continuation information }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/draft/open:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Open a shared draft or explicitly replace it with a saved revision
      description: Requires the render:draft:write scope. Set replaceVersion only after confirming replacement.
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revisionId: { type: string, pattern: "^revision_[a-f0-9]{32}$" }
                replaceVersion: { type: integer, minimum: 1 }
      responses:
        "200": { description: Open or replaced shared draft }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/draft/changes:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Apply an idempotent batch to the exact draft version
      description: Requires the render:draft:write scope. Use the same idempotencyKey and body after an interrupted response.
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, idempotencyKey, files]
              properties:
                version: { type: integer, minimum: 1 }
                idempotencyKey: { type: string, minLength: 16, maxLength: 200 }
                entrypoint: { type: string }
                engine: { type: string }
                outputs:
                  { type: array, items: { type: string, enum: [pdf, svg] } }
                files:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [path]
                    properties:
                      path: { type: string }
                      remove: { type: boolean, enum: [true] }
                      text: { type: string }
                      base64: { type: string }
                      patch:
                        type: object
                        required: [expectedSha256, original, replacement]
                        properties:
                          expectedSha256:
                            { type: string, pattern: "^[a-f0-9]{64}$" }
                          original: { type: string }
                          replacement: { type: string }
                          expectedMatches:
                            { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200": { description: Resulting draft version and changed paths }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/draft/preview:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Queue or reuse a PDF preview of the exact shared draft version
      description: Requires both render:create and render:draft:write. A reused preview belongs to the same user.
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Queued or reused preview
          content:
            application/json:
              schema:
                type: object
                required: [jobId, version, reused]
                properties:
                  jobId: { type: string, pattern: "^job_[a-f0-9]{32}$" }
                  version: { type: integer, minimum: 1 }
                  reused: { type: boolean }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/draft/save:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Save the exact draft version as a Project revision
      description: Requires the render:draft:write scope.
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, displayName]
              properties:
                version: { type: integer, minimum: 1 }
                displayName: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 1000 }
      responses:
        "200": { description: Saved revision identity and build settings }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/revisions:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      summary: Attach an owned ready Source as an immutable Project revision
      description: Same Project, Source and entrypoint reuse the existing revision. This does not queue a Job.
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachRevisionRequest" }
      responses:
        "201":
          {
            description: Revision ID,
            number,
            Source ID,
            entrypoint and default outputs,
          }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/revisions/{revisionId}/jobs:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/RevisionId" }
    get:
      summary: Page through Jobs associated with one Project revision
      security: [{ renderApiKey: [] }]
      parameters:
        - { in: query, name: cursor, schema: { type: string } }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
      responses:
        "200": { description: Paginated Job summaries }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/revisions/{revisionId}/files:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/RevisionId" }
    get:
      summary: List files or read UTF-8 text from a saved Project revision
      description: Requires an explicitly granted render:project:read scope. When path is present, offset counts UTF-16 code units. Otherwise offset counts files.
      security: [{ renderApiKey: [] }]
      parameters:
        - {
            in: query,
            name: path,
            schema: { type: string, minLength: 1, maxLength: 2048 },
          }
        - { in: query, name: offset, schema: { type: integer, minimum: 0 } }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 25 },
          }
      responses:
        "200":
          { description: Saved revision identity and a page of files or text }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "416": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/revisions/{revisionId}/render:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/RevisionId" }
    post:
      summary: Queue a Job bound to this exact Project revision
      security: [{ renderApiKey: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                outputs: { $ref: "#/components/schemas/RenderOutputs" }
      responses:
        "200": { description: Idempotently reused Job and renewed ticket }
        "201":
          {
            description: New Job ID and short-lived ticket,
            Project and revision IDs,
          }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/source-tickets:
    get:
      summary: Read the current Source ZIP upload and extraction limits
      security: [{ renderApiKey: [] }]
      responses:
        "200":
          description: Effective Source limits in bytes and file counts
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    maxUploadBytes,
                    maxExtractedBytes,
                    maxFileCount,
                    maxZipEntries,
                  ]
                properties:
                  maxUploadBytes: { type: integer, minimum: 1 }
                  maxExtractedBytes: { type: integer, minimum: 1 }
                  maxFileCount: { type: integer, minimum: 1 }
                  maxZipEntries: { type: integer, minimum: 1 }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Reserve or deduplicate an immutable Source
      security: [{ renderApiKey: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceTicketRequest" }
      responses:
        "200":
          description: Existing ready or idempotent Source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceTicketResponse" }
        "201":
          description: Source reserved; upload it when uploadRequired is true
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceTicketResponse" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/render-tickets:
    post:
      summary: Create a render job
      description: Reserve a job using the ZIP size and SHA-256, then return upload and job-operation tickets.
      security: [{ renderApiKey: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: A unique value for this request. Reusing it with different content is rejected.
          schema: { type: string, minLength: 16, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenderTicketRequest" }
            example:
              size: 12345
              sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
              outputs: [pdf, svg]
      responses:
        "200":
          description: Existing idempotent job and freshly issued short-lived tickets
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/TicketResponse" }
                  - { $ref: "#/components/schemas/SourceRenderResponse" }
        "201":
          description: Job and tickets created
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/TicketResponse" }
                  - { $ref: "#/components/schemas/SourceRenderResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environment:
    get:
      summary: Read Renderer capabilities
      description: Requires the render:create scope.
      security: [{ renderApiKey: [] }]
      responses:
        "200": { description: Successful operation }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/environment/profiles:
    get:
      summary: List authoring profiles
      description: Requires the render:create scope.
      security: [{ renderApiKey: [] }]
      responses:
        "200": { description: Successful operation }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/environment/packages/check:
    post:
      summary: Check named packages
      description: Requires the render:create scope.
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [names]
              properties:
                names:
                  {
                    type: array,
                    minItems: 1,
                    maxItems: 50,
                    items: { type: string },
                  }
      responses:
        "200": { description: Successful operation }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/environment/packages/search:
    get:
      summary: Search package names
      description: Requires the render:create scope.
      security: [{ renderApiKey: [] }]
      parameters:
        - { in: query, name: query, required: true, schema: { type: string } }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        "200": { description: Successful operation }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/environment/fonts/check:
    post:
      summary: Check named fonts
      description: Requires the render:create scope.
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [names]
              properties:
                names:
                  {
                    type: array,
                    minItems: 1,
                    maxItems: 50,
                    items: { type: string },
                  }
      responses:
        "200": { description: Successful operation }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/environment/fonts/search:
    get:
      summary: Search font families
      description: Requires the render:create scope.
      security: [{ renderApiKey: [] }]
      parameters:
        - { in: query, name: query, required: true, schema: { type: string } }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        "200": { description: Successful operation }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/environment/requirements/check:
    post:
      summary: Check document requirements
      description: Requires the render:create scope.
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [engine]
              properties:
                engine: { $ref: "#/components/schemas/RenderEngine" }
                requirements:
                  { type: array, maxItems: 32, items: { type: object } }
                revision:
                  type: object
                  required: [projectId, revisionId]
                  properties:
                    projectId: { type: string }
                    revisionId: { type: string }
                    inspectEntrypoint: { type: boolean }
      responses:
        "200": { description: Successful operation }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/environment/requirements/probe:
    post:
      summary: Request or poll a synthetic document probe
      description: Requires the render:create scope.
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [engine]
              properties:
                engine: { $ref: "#/components/schemas/RenderEngine" }
                documentClass: { type: string, default: article }
                packages: { type: array, maxItems: 12, items: { type: string } }
                font: { type: string }
                mathFont: { type: string }
                japanese: { type: boolean, default: false }
      responses:
        "200": { description: Successful operation }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/job-tickets/{jobId}/retry:
    post:
      summary: Retry a terminal Job with its reusable Source
      description: Requires the render:create scope and Job ownership.
      security: [{ renderApiKey: [] }]
      parameters:
        - {
            in: path,
            name: jobId,
            required: true,
            schema: { type: string, pattern: "^job_[a-f0-9]{32}$" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                idempotencyKey: { type: string, minLength: 16, maxLength: 200 }
      responses:
        "200": { description: Successful operation }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/job-tickets/{jobId}/diagnostics:
    get:
      summary: Read a page of render diagnostics
      description: Requires the render:read:own scope and Job ownership.
      security: [{ renderApiKey: [] }]
      parameters:
        - {
            in: path,
            name: jobId,
            required: true,
            schema: { type: string, pattern: "^job_[a-f0-9]{32}$" },
          }
        - { in: query, name: stage, schema: { type: string, enum: [pdf, svg] } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0 } }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 25 },
          }
      responses:
        "200": { description: Successful operation }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/job-tickets/{jobId}/log:
    get:
      summary: Read a compile-log window
      description: Requires the render:read:own scope and Job ownership.
      security: [{ renderApiKey: [] }]
      parameters:
        - {
            in: path,
            name: jobId,
            required: true,
            schema: { type: string, pattern: "^job_[a-f0-9]{32}$" },
          }
        - { in: query, name: stage, schema: { type: string, enum: [pdf, svg] } }
        - { in: query, name: startByte, schema: { type: integer, minimum: 0 } }
        - { in: query, name: startLine, schema: { type: integer, minimum: 1 } }
        - {
            in: query,
            name: sha256,
            schema: { type: string, pattern: "^[a-f0-9]{64}$" },
          }
      responses:
        "200": { description: Successful operation }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/job-tickets/{jobId}/manifest:
    get:
      summary: Read a render manifest
      description: Requires the render:read:own scope and Job ownership.
      security: [{ renderApiKey: [] }]
      parameters:
        - {
            in: path,
            name: jobId,
            required: true,
            schema: { type: string, pattern: "^job_[a-f0-9]{32}$" },
          }
      responses:
        "200": { description: Successful operation }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/pdf-inspections/compare:
    post:
      summary: Compare observations for two exact PDFs
      description: Requires the render:pdf:inspect scope and ownership of both Jobs.
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [before, after]
              properties:
                before: { $ref: "#/components/schemas/JobPdf" }
                after: { $ref: "#/components/schemas/JobPdf" }
      responses:
        "200": { description: Successful operation }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/job-tickets/{jobId}/pdf-inspection:
    parameters:
      - {
          in: path,
          name: jobId,
          required: true,
          schema: { type: string, pattern: "^job_[a-f0-9]{32}$" },
        }
    get:
      summary: Read the inspection report for an exact PDF
      description: Requires the render:pdf:inspect scope and Job ownership.
      security: [{ renderApiKey: [] }]
      parameters:
        - {
            in: query,
            name: pdfSha256,
            required: true,
            schema: { type: string, pattern: "^[a-f0-9]{64}$" },
          }
      responses:
        "200": { description: Inspection state and report when available }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
    post:
      summary: Request or reuse an inspection of an exact PDF
      description: Requires the render:pdf:inspect scope and Job ownership. The request does not create a new render.
      security: [{ renderApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pdfSha256]
              properties:
                pdfSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
                params:
                  type: object
                  description: Supply normalized crop geometry, an ordered array of pages, or a SyncTeX query with direction. Omit for a quality report.
      responses:
        "200": { description: Accepted or existing inspection state }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/job-tickets/{jobId}:
    post:
      summary: Renew a job-operation ticket
      description: Ordinary jobs require render:read:own and the owning key. An API key with render:create and render:draft:write can obtain a status and download ticket for a preview of its owner's shared draft.
      security: [{ renderApiKey: [] }]
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string, pattern: "^job_[a-f0-9]{32}$" }
      responses:
        "200":
          description: Ticket renewed
          content:
            application/json:
              schema:
                type: object
                required: [jobTicket, expiresAt]
                properties:
                  jobTicket: { type: string }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, pattern: "^project_[a-f0-9]{32}$" }
    RevisionId:
      in: path
      name: revisionId
      required: true
      schema: { type: string, pattern: "^revision_[a-f0-9]{32}$" }
  schemas:
    AttachRevisionRequest:
      type: object
      additionalProperties: false
      required: [sourceId, entrypoint, displayName, originalFilename]
      properties:
        sourceId: { type: string, pattern: "^source_[a-f0-9]{32}$" }
        entrypoint: { type: string, minLength: 1, maxLength: 240 }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        originalFilename: { type: string, minLength: 1, maxLength: 240 }
        outputs: { $ref: "#/components/schemas/RenderOutputs" }
        engine: { $ref: "#/components/schemas/RenderEngine" }
    RenderTicketRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [size, sha256]
          properties:
            size: { type: integer, minimum: 1, maximum: 20971520 }
            sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
            outputs: { $ref: "#/components/schemas/RenderOutputs" }
            engine: { $ref: "#/components/schemas/RenderEngine" }
        - type: object
          additionalProperties: false
          required: [sourceId]
          properties:
            sourceId: { type: string, pattern: "^source_[a-f0-9]{32}$" }
            entrypoint: { type: string, maxLength: 2048, default: main.tex }
            outputs: { $ref: "#/components/schemas/RenderOutputs" }
            engine: { $ref: "#/components/schemas/RenderEngine" }
        - type: object
          additionalProperties: false
          required: [retrySvgJobId]
          properties:
            retrySvgJobId: { type: string, pattern: "^job_[a-f0-9]{32}$" }
    SourceTicketRequest:
      type: object
      additionalProperties: false
      required: [size, sha256]
      properties:
        size: { type: integer, minimum: 1, maximum: 20971520 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    JobPdf:
      type: object
      additionalProperties: false
      required: [jobId, pdfSha256]
      properties:
        jobId: { type: string, pattern: "^job_[a-f0-9]{32}$" }
        pdfSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    RenderEngine:
      type: string
      enum: [lualatex, pdflatex, xelatex, uplatex, platex]
      default: lualatex
      description: pLaTeX and upLaTeX require a Runtime with the Japanese TeX Live collection.
    RenderOutputs:
      type: array
      default: [pdf]
      minItems: 1
      maxItems: 2
      uniqueItems: true
      description: PDF is mandatory; include svg to extract outermost math and top-level TikZ objects.
      items: { type: string, enum: [pdf, svg] }
    TicketResponse:
      type: object
      required: [jobId, uploadTicket, jobTicket, uploadUrl, expiresAt]
      properties:
        jobId: { type: string }
        uploadTicket: { type: string }
        jobTicket: { type: string }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    SourceTicketResponse:
      type: object
      required: [sourceId, uploadRequired, expiresAt]
      properties:
        sourceId: { type: string, pattern: "^source_[a-f0-9]{32}$" }
        uploadRequired: { type: boolean }
        uploadTicket: { type: string }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    SourceRenderResponse:
      type: object
      required: [jobId, jobTicket, expiresAt]
      properties:
        jobId: { type: string, pattern: "^job_[a-f0-9]{32}$" }
        jobTicket: { type: string }
        expiresAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  securitySchemes:
    renderApiKey:
      type: http
      scheme: bearer
      bearerFormat: lrk
