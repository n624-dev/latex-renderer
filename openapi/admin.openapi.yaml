openapi: 3.1.0
info:
  title: LaTeX Renderer Administrator API
  version: 1.3.1
  description: Administrative API used by the authenticated Web UI and administration CLI. Browser login endpoints are rooted at /auth rather than this server prefix.
servers:
  - url: /admin/api/v1
security:
  - browserSession: []
  - adminKey: []
paths:
  /session:
    get:
      summary: Establish or inspect the provider-neutral browser session
      security:
        - browserSession: []
      responses:
        "200":
          description: Current browser session, authentication mode, user, and CSRF token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /me:
    get:
      summary: Return the authenticated administrator
      responses:
        "200": { description: Administrator identity }
  /users:
    get:
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Query"
      responses:
        "200": { description: Users }
    post:
      summary: Create a user with an explicit external identity or local credential
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUser" }
      responses:
        "201": { description: Created }
        "409": { description: The identity or login name is already assigned }
  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Get a user
      responses:
        "200": { description: User }
    patch:
      summary: Update optional email, display name, or role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: [string, "null"], format: email, maxLength: 320 }
                displayName: { type: string, minLength: 1, maxLength: 200 }
                role: { $ref: "#/components/schemas/Role" }
              minProperties: 1
      responses:
        "200": { description: Updated }
  /users/{id}/enable:
    post:
      summary: Enable a user
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Enabled }
  /users/{id}/disable:
    post:
      summary: Disable a user
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Disabled }
        "409": { description: The final active owner cannot be disabled }
  /users/{id}/identities/{identityId}/unlink:
    post:
      summary: Unlink a provisioned external identity and revoke the user's sessions
      description: Owner-only. Email attributes never cause automatic relinking.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - in: path
          name: identityId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { description: Identity unlinked and sessions revoked }
        "403": { description: Owner role required }
        "409":
          {
            description: Self-unlink or a concurrent identity change was rejected,
          }
  /users/{id}/password:
    post:
      summary: Replace a local login credential and revoke the user's sessions
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [loginName, password, reason]
              properties:
                loginName:
                  { type: string, pattern: "^[a-z0-9][a-z0-9._-]{2,63}$" }
                password: { type: string, minLength: 12, maxLength: 1024 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { description: Credential replaced }
        "403": { description: Owner role required }
  /service-accounts:
    get:
      summary: List service accounts
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Query"
      responses:
        "200": { description: Service accounts }
    post:
      summary: Create a service account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateServiceAccount" }
      responses:
        "201": { description: Created }
  /service-accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Get a service account
      responses:
        "200": { description: Service account }
    patch:
      summary: Update a service account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateServiceAccount" }
      responses:
        "200": { description: Updated }
    delete:
      summary: Disable a service account and revoke all related API keys
      responses:
        "204": { description: Disabled and keys revoked }
  /service-accounts/{id}/enable:
    post:
      summary: Enable a service account
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Enabled }
  /service-accounts/{id}/disable:
    post:
      summary: Disable a service account
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Disabled }
  /service-accounts/{id}/api-keys:
    post:
      summary: Issue an API key for a service account
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKey" }
      responses:
        "201": { description: Key issued. The secret is returned only once. }
  /api-keys:
    get:
      summary: List API keys without secrets
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Query"
      responses:
        "200": { description: API keys }
  /api-keys/{id}:
    get:
      summary: Get API key metadata
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: API key metadata }
  /api-keys/{id}/revoke:
    post:
      summary: Revoke an API key
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Revoked }
  /api-keys/{id}/rotate:
    post:
      summary: Rotate an API key and revoke the previous key
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "201": { description: New key issued once }
  /jobs:
    get:
      summary: List render jobs
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Query"
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: sourceId, schema: { type: string } }
      responses:
        "200": { description: Jobs }
  /jobs/render-targets:
    get:
      summary: List active render identities available to the administrator Web UI
      description: Returns identifiers and labels only. API key secrets and hashes are never returned.
      responses:
        "200":
          description: Eligible active service accounts and render API keys
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RenderTarget" }
  /jobs/render-tickets:
    post:
      summary: Create a render job from the authenticated administrator Web UI
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRenderTicketRequest" }
      responses:
        "201":
          description: Job reserved and short-lived tickets issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenderTicket" }
        "200":
          description: Existing idempotent job and freshly issued short-lived tickets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenderTicket" }
        "409":
          {
            description: The selected render identity is unavailable or the idempotency key conflicts,
          }
  /jobs/source-tickets:
    post:
      summary: Reserve or reuse a Source for administrator browser rendering
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSourceTicketRequest" }
      responses:
        "200": { description: Existing ready or idempotent Source }
        "201": { description: Source reserved }
  /jobs/bulk-delete:
    post:
      summary: Mark up to 100 terminal jobs for deletion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkDeleteJobsRequest" }
      responses:
        "202": { description: Accepted job IDs }
  /jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Get a render job
      responses:
        "200": { description: Job }
    delete:
      summary: Mark a terminal render job for deletion
      responses:
        "202": { description: Deletion requested }
  /jobs/{id}/cancel:
    post:
      summary: Request cancellation
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "202": { description: Cancellation requested }
  /jobs/{id}/retry:
    post:
      summary: Retry a terminal job
      parameters:
        - $ref: "#/components/parameters/Id"
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 200 }
      responses:
        "202": { description: Retry created }
  /jobs/{id}/artifacts/{path}:
    get:
      summary: Download a retained Job artifact through the administrator session
      parameters:
        - $ref: "#/components/parameters/Id"
        - in: path
          name: path
          required: true
          description: Nested relative artifact path, including svg/manifest.json and svg/objects/*.svg.
          schema: { type: string, minLength: 1, maxLength: 512 }
        - in: query
          name: disposition
          schema: { type: string, enum: [attachment, inline] }
      responses:
        "200": { description: Integrity-labelled artifact stream }
        "410": { description: Job artifact retention has expired }
  /jobs/{id}/archive:
    get:
      summary: Stream all retained Job artifacts as a ZIP archive
      description: The archive is assembled as a bounded stream; artifacts are not aggregated in browser or server memory.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: ZIP artifact stream
          content:
            application/zip: {}
        "404": { description: No downloadable artifacts exist }
        "410": { description: Job artifact retention has expired }
  /jobs/{id}/previews/{name}:
    get:
      summary: View or download a retained page preview through the administrator session
      parameters:
        - $ref: "#/components/parameters/Id"
        - in: path
          name: name
          required: true
          schema: { type: string, pattern: "^page-[1-9][0-9]{0,2}\\.png$" }
        - in: query
          name: disposition
          schema: { type: string, enum: [attachment, inline] }
      responses:
        "200": { description: Integrity-labelled PNG stream }
        "410": { description: Job artifact retention has expired }
  /sources:
    get:
      summary: List retained Sources and their related Jobs
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Query"
        - { in: query, name: status, schema: { type: string } }
      responses:
        "200": { description: Sources }
  /sources/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Get Source paths, entrypoints, retention, and related Jobs
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200": { description: Source }
    delete:
      summary: Delete an unreferenced retained Source
      responses:
        "202": { description: Deletion requested }
        "409": { description: Retained Jobs still reference the Source }
  /sources/{id}/render:
    post:
      summary: Create a new Job from an existing Source and selected entrypoint
      parameters:
        - $ref: "#/components/parameters/Id"
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceRenderRequest" }
      responses:
        "201": { description: Job created }
  /sources/{id}/source-ref:
    post:
      summary: Issue a short-lived Remote MCP reference for a retained Source
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceReferenceRequest" }
      responses:
        "201": { description: Source reference issued }
  /tex-environment/state:
    get:
      summary: Read persisted desired, current, previous, and active TeX image state
      description: Requires admin:tex-environment:read (or emergency compatibility scope admin:*).
      responses:
        "200": { description: TeX environment state }
        "503": { description: Image Manager is not configured or unavailable }
  /tex-environment/images:
    get:
      summary: List available Daily and Weekly GHCR image selectors
      description: Requires admin:tex-environment:read (or emergency compatibility scope admin:*).
      responses:
        "200":
          {
            description: Available image tags or degraded registryUnavailable response,
          }
        "503": { description: Image Manager is not configured or unavailable }
  /tex-environment/languages:
    get:
      summary: List TeX Live language collections in the shared country-aware order
      description: Requires admin:tex-environment:read (or emergency compatibility scope admin:*). The server uses its detected country or the persisted country override for ordering only; no language is automatically selected. If live catalog discovery fails, the response sets catalogUnavailable=true and returns persisted choices only.
      responses:
        "200":
          {
            description: Language catalog with detected/effective country and selection state,
          }
        "503": { description: Image Manager is not configured or unavailable }
  /tex-environment/country:
    post:
      summary: Set or clear the persisted country override used for language ordering
      description: Requires admin:tex-environment:write (or emergency compatibility scope admin:*). This changes ordering only, not the active runtime.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [country]
              properties:
                country: { type: [string, "null"], pattern: "^[A-Z]{2}$" }
      responses:
        "200": { description: Country override updated }
        "409": { description: A TeX image operation is active }
  /tex-environment/apply:
    post:
      summary: Build, validate, and transactionally activate a TeX runtime from a clean selected base
      description: Requires admin:tex-environment:write and an owner actor. admin:* satisfies the scope check only; a non-empty reason is recorded in audit metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TexEnvironmentApply" }
      responses:
        "202": { description: Image operation accepted }
        "409": { description: Another image operation is active }
  /tex-environment/operations/{id}:
    get:
      summary: Read image operation progress and retained log output
      description: Requires admin:tex-environment:read (or emergency compatibility scope admin:*).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Operation state and log }
        "404": { description: Operation not found }
  /tex-environment/inventory/{kind}:
    get:
      summary: Search the current runtime package or font inventory
      description: Requires admin:tex-environment:read (or emergency compatibility scope admin:*).
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [packages, fonts] }
        - in: query
          name: q
          schema: { type: string, maxLength: 200 }
      responses:
        "200": { description: Matching inventory entries }
  /tex-environment/rollback:
    post:
      summary: Validate and activate the previous known-good runtime
      description: Requires admin:tex-environment:write and an owner actor. admin:* satisfies the scope check only; a non-empty reason is recorded in audit metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminMutationReasonRequest" }
      responses:
        "202": { description: Rollback operation accepted }
  /tex-environment/revalidate:
    post:
      summary: Re-run production-equivalent validation for the current runtime
      description: Requires admin:tex-environment:write and an owner actor. admin:* satisfies the scope check only; a non-empty reason is recorded in audit metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminMutationReasonRequest" }
      responses:
        "202": { description: Revalidation operation accepted }
  /tex-environment/cleanup:
    post:
      summary: Remove safe unused locally derived images while preserving current and previous runtimes/bases
      description: Requires admin:tex-environment:write and an owner actor. admin:* satisfies the scope check only; a non-empty reason is recorded in audit metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminMutationReasonRequest" }
      responses:
        "202": { description: Cleanup operation accepted }
  /tex-environment/refresh:
    post:
      summary: Follow a newer validated latest image when automatic following is enabled
      description: Requires admin:tex-environment:write and an owner actor. admin:* satisfies the scope check only; a non-empty reason is recorded in audit metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminMutationReasonRequest" }
      responses:
        "202": { description: Refresh operation accepted }
  /updates/state:
    get:
      summary: Read installed, available, previous, and active application update state
      description: Requires admin:update:read (or emergency compatibility scope admin:*).
      responses:
        "200": { description: Application update state }
        "503": { description: Update Manager is not configured or unavailable }
  /updates/check:
    post:
      summary: Check and verify an immutable stable GitHub Release
      description: Requires admin:update:read (or emergency compatibility scope admin:*).
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationUpdateRequest" }
      responses:
        "200": { description: Verified release metadata }
  /updates/policy:
    post:
      summary: Select notification-only or opt-in automatic stable application updates
      description: Requires admin:update:write and an owner actor. admin:* satisfies the scope check only; a non-empty reason is recorded in audit metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode, reason]
              properties:
                channel: { type: string, const: stable, default: stable }
                mode: { type: string, enum: [notify, automatic] }
                reason: { $ref: "#/components/schemas/AdminMutationReason" }
      responses:
        "200": { description: Persisted update policy }
        "409": { description: An application update operation is active }
  /updates/refresh:
    post:
      summary: Check the stable channel and start an update only when automatic mode is enabled
      description: Requires admin:update:write and an owner actor. admin:* satisfies the scope check only; a non-empty reason is recorded in audit metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminMutationReasonRequest" }
      responses:
        "200":
          { description: Up-to-date, unavailable, available, or started result }
  /updates/apply:
    post:
      summary: Download, verify, stage, and transactionally deploy an immutable application release
      description: Requires admin:update:write and an owner actor. admin:* satisfies the scope check only; a non-empty reason is recorded in audit metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/ApplicationUpdateApplyRequest" }
      responses:
        "202": { description: Application update operation accepted }
        "409": { description: Another application update operation is active }
  /updates/rollback:
    post:
      summary: Back up current state and redeploy the previous known-good application release
      description: Requires admin:update:write and an owner actor. admin:* satisfies the scope check only; a non-empty reason is recorded in audit metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminMutationReasonRequest" }
      responses:
        "202": { description: Application rollback operation accepted }
        "409": { description: Another application update operation is active }
  /updates/operations/{id}:
    get:
      summary: Read application update progress and retained redacted log output
      description: Requires admin:update:read (or emergency compatibility scope admin:*).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Application update operation and log }
        "404": { description: Operation not found }
  /system/status:
    get:
      summary: Read system status
      responses:
        "200": { description: Status }
  /system/config:
    get:
      summary: Read mutable limits
      responses:
        "200": { description: Configuration }
    patch:
      summary: Update a mutable limit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSystemConfigRequest" }
      responses:
        "200": { description: Updated }
  /system/maintenance/enable:
    post:
      summary: Enable maintenance mode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnableMaintenanceRequest" }
      responses:
        "200": { description: Mode updated }
  /system/maintenance/disable:
    post:
      summary: Disable maintenance mode
      responses:
        "200": { description: Mode updated }
  /system/ticket-keys:
    get:
      summary: List active and verification-only ticket signing key identifiers
      responses:
        "200":
          { description: Key identifiers and the minimum revocation duration }
  /system/ticket-keys/{kid}/revoke:
    post:
      summary: Revoke a ticket signing key identifier
      parameters:
        - in: path
          name: kid
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,100}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, expiresAt]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
                expiresAt:
                  {
                    type: string,
                    format: date-time,
                    description: Must remain active for at least 35 minutes.,
                  }
      responses:
        "200": { description: Revoked }
        "409": { description: The active signing key cannot be revoked }
  /worker/{action}:
    post:
      summary: Pause, resume, or drain the worker
      parameters:
        - in: path
          name: action
          required: true
          schema: { type: string, enum: [pause, resume, drain] }
      responses:
        "200": { description: Worker mode updated }
  /audit-logs:
    get:
      summary: Search and page audit log entries
      parameters:
        - {
            in: query,
            name: page,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { in: query, name: action, schema: { type: string, maxLength: 200 } }
        - { in: query, name: actor, schema: { type: string, maxLength: 500 } }
        - { in: query, name: target, schema: { type: string, maxLength: 500 } }
        - { in: query, name: result, schema: { type: string, maxLength: 100 } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        "200":
          {
            description: Audit log page with items,
            page,
            pageSize,
            total,
            and totalPages,
          }
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string }
    Cursor:
      in: query
      name: cursor
      description: Opaque keyset cursor returned by the previous page.
      schema: { type: string, maxLength: 1024 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Query:
      in: query
      name: query
      schema: { type: string, maxLength: 500 }
  schemas:
    Session:
      type: object
      required: [authenticated, authMode, csrfToken, user]
      properties:
        authenticated: { type: boolean, const: true }
        authMode: { type: string, enum: [cloudflare-access, oidc, password] }
        csrfToken: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        user:
          type: object
          required: [id, email, displayName, role, status]
          properties:
            id: { type: string }
            email: { type: [string, "null"], format: email }
            displayName: { type: string }
            role: { $ref: "#/components/schemas/Role" }
            status: { type: string, enum: [active, disabled] }
    Role:
      type: string
      enum: [user, admin, owner]
    CreateUser:
      type: object
      additionalProperties: false
      required: [displayName, role, authentication]
      properties:
        email: { type: [string, "null"], format: email, maxLength: 320 }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: "#/components/schemas/Role" }
        authentication:
          oneOf:
            - type: object
              additionalProperties: false
              required: [type, subject]
              properties:
                type: { type: string, const: external }
                subject: { type: string, minLength: 1, maxLength: 500 }
                preferredUsername:
                  { type: string, minLength: 1, maxLength: 500 }
                emailAtProvider: { type: string, format: email, maxLength: 320 }
            - type: object
              additionalProperties: false
              required: [type, loginName, password]
              properties:
                type: { type: string, const: password }
                loginName:
                  { type: string, pattern: "^[a-z0-9][a-z0-9._-]{2,63}$" }
                password: { type: string, minLength: 12, maxLength: 1024 }
    CreateServiceAccount:
      type: object
      additionalProperties: false
      required: [ownerUserId, name, clientType]
      properties:
        ownerUserId: { type: string }
        name: { type: string, minLength: 1, maxLength: 100 }
        clientType:
          { type: string, enum: [codex, claude-code, mcp, ci, generic] }
    UpdateServiceAccount:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        clientType:
          { type: string, enum: [codex, claude-code, mcp, ci, generic] }
    CreateApiKey:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scopes:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          description: Render and admin scopes cannot be mixed. Admin key issuance is owner-only.
          items:
            type: string
            enum:
              [
                render:create,
                render:read:own,
                "admin:users:read",
                "admin:users:write",
                "admin:service-accounts:read",
                "admin:service-accounts:write",
                "admin:api-keys:read",
                "admin:api-keys:write",
                "admin:jobs:read",
                "admin:jobs:write",
                "admin:system:read",
                "admin:system:write",
                "admin:update:read",
                "admin:update:write",
                "admin:tex-environment:read",
                "admin:tex-environment:write",
                "admin:audit:read",
                "admin:*",
              ]
        expiresAt: { type: [string, "null"], format: date-time }
    TexImageSelector:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { type: string, const: latest }
            value: { type: "null", default: null }
        - type: object
          additionalProperties: false
          required: [mode, value]
          properties:
            mode: { type: string, const: date }
            value: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        - type: object
          additionalProperties: false
          required: [mode, value]
          properties:
            mode: { type: string, const: weekly }
            value:
              {
                type: string,
                pattern: "^\\d{4}-W(?:0[1-9]|[1-4][0-9]|5[0-3])$",
              }
        - type: object
          additionalProperties: false
          required: [mode, value]
          properties:
            mode: { type: string, const: digest }
            value: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
    TexEnvironmentApply:
      type: object
      additionalProperties: false
      required: [selector, languages, autoUpdate, reason]
      properties:
        selector: { $ref: "#/components/schemas/TexImageSelector" }
        languages:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, pattern: "^collection-lang[A-Za-z0-9._-]+$" }
        autoUpdate:
          type: boolean
          description: Valid only with the latest selector.
        rebuildIfMissing:
          type: boolean
          default: true
          description: For a dated selector missing from GHCR, cold-build the same TeX Live archive locally.
        runtimeBuildIfMissing:
          type: boolean
          default: false
          description: Build a custom-language Runtime locally only after GHCR confirms that the exact prebuilt Runtime tag is absent.
        reason: { $ref: "#/components/schemas/AdminMutationReason" }
    AdminMutationReason:
      type: string
      minLength: 1
      maxLength: 500
      description: Human-readable change reason recorded in audit metadata. Do not include secrets or credentials.
    AdminMutationReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/AdminMutationReason" }
    ApplicationUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          pattern: "^v?[0-9]+\\.[0-9]+\\.[0-9]+$"
          description: An explicit immutable release version. Omit to select the latest stable release.
    ApplicationUpdateApplyRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        version:
          type: string
          pattern: "^v?[0-9]+\\.[0-9]+\\.[0-9]+$"
          description: An explicit immutable release version. Omit to select the latest stable release.
        reason: { $ref: "#/components/schemas/AdminMutationReason" }
    RenderTarget:
      type: object
      additionalProperties: false
      required:
        [
          apiKeyId,
          apiKeyName,
          serviceAccountId,
          serviceAccountName,
          userId,
          userLabel,
        ]
      properties:
        apiKeyId: { type: string }
        apiKeyName: { type: string }
        serviceAccountId: { type: string }
        serviceAccountName: { type: string }
        userId: { type: string }
        userLabel: { type: string, minLength: 1, maxLength: 320 }
    AdminRenderTicketRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [apiKeyId, size, sha256]
          properties:
            apiKeyId: { type: string, minLength: 1, maxLength: 128 }
            size: { type: integer, minimum: 1, maximum: 20971520 }
            sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
            outputs: { $ref: "#/components/schemas/RenderOutputs" }
        - type: object
          additionalProperties: false
          required: [apiKeyId, sourceId]
          properties:
            apiKeyId: { type: string, minLength: 1, maxLength: 128 }
            sourceId: { type: string, pattern: "^source_[a-f0-9]{32}$" }
            entrypoint: { type: string, maxLength: 2048, default: main.tex }
            outputs: { $ref: "#/components/schemas/RenderOutputs" }
    AdminSourceTicketRequest:
      type: object
      additionalProperties: false
      required: [apiKeyId, size, sha256]
      properties:
        apiKeyId: { type: string, minLength: 1, maxLength: 128 }
        size: { type: integer, minimum: 1, maximum: 20971520 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    BulkDeleteJobsRequest:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, pattern: "^job_[a-f0-9]{32}$" }
    SourceRenderRequest:
      type: object
      additionalProperties: false
      required: [apiKeyId]
      properties:
        apiKeyId: { type: string, minLength: 1, maxLength: 128 }
        entrypoint: { type: string, minLength: 1, maxLength: 240 }
        outputs: { $ref: "#/components/schemas/RenderOutputs" }
    SourceReferenceRequest:
      type: object
      additionalProperties: false
      required: [apiKeyId]
      properties:
        apiKeyId: { type: string, minLength: 1, maxLength: 128 }
    UpdateSystemConfigRequest:
      type: object
      additionalProperties: false
      required: [key, value, reason]
      properties:
        key:
          type: string
          enum:
            [
              max_queue_length,
              max_user_storage_bytes,
              max_user_active_jobs,
              source_orphan_retention_minutes,
            ]
        value: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    EnableMaintenanceRequest:
      type: object
      additionalProperties: false
      required: [mode, reason]
      properties:
        mode:
          type: string
          enum: [reject-new-jobs, read-only, lockdown]
        reason: { type: string, minLength: 1, maxLength: 500 }
    RenderOutputs:
      type: array
      default: [pdf]
      minItems: 1
      maxItems: 2
      uniqueItems: true
      items: { type: string, enum: [pdf, svg] }
    RenderTicket:
      type: object
      additionalProperties: false
      required: [jobId, uploadTicket, jobTicket, uploadUrl, expiresAt]
      properties:
        jobId: { type: string, pattern: "^job_[a-f0-9]{32}$" }
        uploadTicket: { type: string }
        jobTicket: { type: string }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-latex_renderer_session
      description: Provider-neutral Secure HttpOnly browser session. Mutations also require the per-session X-CSRF-Token and exact Origin.
    adminKey:
      type: http
      scheme: bearer
      description: Scoped lra_ administration API key for CLI use. It is independent of browser authentication.
